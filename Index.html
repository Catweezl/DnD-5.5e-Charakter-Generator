function downloadDocx(bodyXml, filename){
  const enc = new TextEncoder();
  const files = [
    {name:'[Content_Types].xml', data: enc.encode(DOCX_CONTENT_TYPES)},
    {name:'_rels/.rels', data: enc.encode(DOCX_RELS_ROOT)},
    {name:'docProps/core.xml', data: enc.encode(DOCX_CORE_PROPS)},
    {name:'docProps/app.xml', data: enc.encode(DOCX_APP_PROPS)},
    {name:'word/document.xml', data: enc.encode(docxDocumentXml(bodyXml))},
    {name:'word/styles.xml', data: enc.encode(DOCX_STYLES)},
    {name:'word/_rels/document.xml.rels', data: enc.encode(DOCX_RELS_DOCUMENT)}
  ];
  const zipBytes = buildZip(files);
  downloadBlob(zipBytes, filename, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}

// Converts a simple HTML-ish string (only <b>/<i> tags, as produced by computeBaselineAC etc.)
// into docx runs, since those strings were originally written for the HTML-based export.
function htmlLineToRuns(line){
  const runs = [];
  const re = /<(b|i)>(.*?)<\/\1>|([^<]+)/g;
  let m;
  while((m = re.exec(line))){
    if(m[3]!==undefined){ if(m[3]) runs.push({text:m[3]}); }
    else runs.push({text:m[2], bold:m[1]==='b', italic:m[1]==='i'});
  }
  return runs.length ? runs : [{text: line}];
}

// Converts a small HTML fragment (divs/br as produced by our summary-rendering helpers) into
// plain text lines, treating any block-ish tag as a line break rather than stripping it silently.
function htmlBlockToLines(html){
  return html
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(div|p|li)>/gi, '\n')
    .replace(/<[^>]+>/g, '')
    .split('\n')
    .map(s=>s.replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim())
    .filter(Boolean);
}

function exportDoc(){
  const sp = DATA.species.find(s=>s.id===state.speciesId);
  const bg = getSelectedBackground();
  const finalScores = computeFullFinalAbilityScores();
  const pb = proficiencyBonusForLevel(state.level);
  const totalHP = computeTotalHP();
  const speed = computeSpeedBreakdown();
  const allSkills = computeAllSkills();
  const expertiseSet = computeExpertiseSkills();
  const profSaves = computeSavingThrows(finalScores, pb).filter(s=>s.isProf).map(s=>s.ability);
  const startClass = classDef(firstClassId());
  const subclassFirst = state.subclassChoices[firstClassId()];
  const acLines = computeBaselineAC(finalScores);

  const SKILLS_BY_ABILITY = {};
  SKILLS.forEach(sk=>{ const a=SKILL_ABILITY[sk]; (SKILLS_BY_ABILITY[a]=SKILLS_BY_ABILITY[a]||[]).push(sk); });

  let x = '';

  // ---- Header ----
  x += wPara([{text: state.charName || 'Unbenannter Charakter'}], {heading:'Title'});
  x += wPara([{text:`Hintergrund: `, bold:true}, {text: bg.name+pageRefSuffix(bg)+'   '}, {text:`Klasse: `, bold:true},
    {text: state.classes.map(c=>{const cd=classDef(c.id); return cd.name+pageRefSuffix(cd)+' '+c.level;}).join(' / ')+'   '},
    {text:`Volk: `, bold:true}, {text: sp.name+(state.speciesSubChoice?' ('+state.speciesSubChoice+')':'')+pageRefSuffix(sp)+'   '},
    {text:`Subklasse: `, bold:true}, {text: subclassFirst||'–'}, {text:'   Stufe: ', bold:true}, {text: String(state.level)}
  ], {spacingAfter:200});

  // ---- Core stats ----
  x += wBox('ARMOR CLASS', acLines.map(l=> wPara(htmlLineToRuns(l))).join(''));
  const classResources = computeClassResources();
  if(classResources.length){
    x += wBox('RESOURCES', classResources.map(r=>
      wPara([{text:`${r.label}: `, bold:true}, {text:`${r.value}`}]) +
      wPara([{text:`${r.formula} · Regeneration: ${r.recharge}`, italic:true, size:18}])
    ).join(''));
  }
  x += wBox('HIT POINTS & HIT DICE',
    wPara(`${totalHP} / ${totalHP}`, {spacingAfter:0}) +
    wPara(`Hit Die: ${state.classes.map(c=>'d'+classDef(c.id).hitDie+' x'+c.level).join(', ')}`)
  );
  x += wBox('PROFICIENCY BONUS / INITIATIVE / SPEED',
    wPara(`Proficiency Bonus: +${pb}   Initiative: ${signed(computeInitiativeBonus(finalScores))}   Speed: ${speed.total} ft`) +
    wPara(speed.lines.join(' · '))
  );
  x += wBox('PASSIVE PERCEPTION / CONDITIONS / INSPIRATION',
    wPara(`Passive Perception: ${computePassivePerception(finalScores, allSkills, pb, expertiseSet)}   Conditions: —   Heroic Inspiration: o   Exhaustion: o o o o o o`)
  );

  // ---- Ability blocks ----
  ABILITIES.forEach(a=>{
    const abilMod = mod(finalScores[a]);
    const isSaveProf = profSaves.includes(a);
    const saveTotal = abilMod + (isSaveProf?pb:0);
    let inner = wPara(`Score: ${finalScores[a]}   Mod: ${signed(abilMod)}   ${isSaveProf?'●':'○'} Save: ${signed(saveTotal)}`);
    (SKILLS_BY_ABILITY[a]||[]).forEach(sk=>{
      const isProf = allSkills.includes(sk);
      const isExp = isProf && expertiseSet.has(sk);
      const bonus = isExp ? pb*2 : (isProf?pb:0);
      inner += wPara(`${isExp?'◆':(isProf?'●':'○')} ${sk}   ${signed(abilMod+bonus)}`);
    });
    x += wBox(ABIL_DE[a].toUpperCase(), inner);
  });
  x += wPara('● = Proficiency · ◆ = Expertise · ○ = keine Proficiency', {spacingAfter:200});

  // ---- Equipment Training & Proficiencies ----
  x += wBox('EQUIPMENT TRAINING & PROFICIENCIES',
    (()=>{ const p = computeArmorWeaponProficiencyText(startClass);
      return wPara([{text:'Rüstung: ', bold:true}, {text:p.armorText}]) +
             wPara([{text:'Waffen: ', bold:true}, {text:p.weaponsText}]);
    })() +
    wPara([{text:'Werkzeuge/Sprachen: ', bold:true}, {text: [resolvedBackgroundTool(bg), ...computeExtraToolProficiencies()].filter(Boolean).join(', ') || '–'}])
  );

  // ---- Weapons & Damage Cantrips ----
  const wmAll = [];
  Object.entries(state.weaponMasteryChoices).forEach(([k,arr])=>{ (arr||[]).forEach(w=>wmAll.push(w)); });
  const cartWeapons = state.shoppingCart.filter(i=>DATA.weapons_simple_melee.concat(DATA.weapons_simple_ranged,DATA.weapons_martial_melee_examples,DATA.weapons_martial_ranged_examples).some(w=>i.name.startsWith(w.name)));
  const spellEntries = collectAllKnownSpells().filter(e=>e.grade===0);
  const wtRows = [['Titel','Bonus/DC','Schaden/Typ','Notizen']];
  wmAll.forEach(w=> wtRows.push([w,'','','Weapon Mastery']));
  cartWeapons.forEach(w=> wtRows.push([w.name,'','','Eingekauft']));
  spellEntries.forEach(s=> wtRows.push([s.name,'','',`Zaubertrick (${s.source})`]));
  const weaponsInner = (wtRows.length>1 ? wTable(wtRows) : wPara('Keine Waffen/Zaubertricks erfasst.'))
    + wPara('Bonus/DC und Schaden bitte selbst eintragen (abhängig von genutztem Attribut/Waffe).', {spacingAfter:0});
  x += wBox('WEAPONS & DAMAGE CANTRIPS', weaponsInner);

  // ---- Class Features ----
  let classFeaturesInner = '';
  state.classes.forEach((cl,idx)=>{
    const cdef = classDef(cl.id);
    const subclass = state.subclassChoices[cl.id];
    classFeaturesInner += wPara([{text:`${cdef.name} ${cl.level}${idx===0?' (Start)':' (Multiclass)'}${subclass?' – '+subclass:''}`, bold:true}]);
    const feats = Object.entries(cdef.keyFeaturesByLevel||{}).filter(([lvl,_])=>parseInt(lvl)<=cl.level).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
    feats.forEach(([lvl,f])=>{
      const pr = (cdef.keyFeaturesPageRefByLevel||{})[lvl];
      const pageSuffix = pr ? pageRefSuffix({pageRef: pr, sourceTag: cdef.sourceTag}) : '';
      classFeaturesInner += wPara(`Stufe ${lvl}: ${f.join(', ')}${pageSuffix}`);
    });
    if(subclass && cdef.subclassDetails && cdef.subclassDetails[subclass] && cdef.subclassDetails[subclass].note){
      classFeaturesInner += wPara([{text:`${subclass} – Details: `, bold:true}, {text: cdef.subclassDetails[subclass].note}]);
      const fPages = cdef.subclassDetails[subclass].featurePages;
      if(fPages && fPages.length){
        classFeaturesInner += wPara([{text: fPages.map(fp=>`${fp.name} (${cdef.sourceTag||'PHB'} S. ${fp.pageRef})`).join(' · '), italic:true, size:16}]);
      }
    }
    if(state.levelUpChoices[cl.id]){
      Object.entries(state.levelUpChoices[cl.id]).sort((a,b)=>a[0]-b[0]).forEach(([lvl,entry])=>{
        const desc = describeLevelUpChoice(cl.id, lvl, entry);
        if(desc) classFeaturesInner += wPara([{text:`Stufe ${lvl}: ${desc}`, italic:true}]);
      });
    }
    const wmKeyDoc = cl.id+'__wm';
    if(state.weaponMasteryChoices[wmKeyDoc] && state.weaponMasteryChoices[wmKeyDoc].length){
      classFeaturesInner += wPara(`Weapon Mastery: ${state.weaponMasteryChoices[wmKeyDoc].join(', ')}`);
    }
    if(cl.id==='cleric' && state.divineOrderChoice){
      classFeaturesInner += wPara(`Divine Order: ${state.divineOrderChoice}` + (state.divineOrderChoice==='Thaumaturge' ? ' (+1 Zaubertrick, +WIS-Mod (mind.+1) auf INT(Arcana/Religion))' : ' (Martial Weapons, Heavy Armor)'));
    }
    if(cl.id==='druid' && state.primalOrderChoice){
      classFeaturesInner += wPara(`Primal Order: ${state.primalOrderChoice}` + (state.primalOrderChoice==='Magician' ? ' (+1 Zaubertrick, +WIS-Mod (mind.+1) auf INT(Arcana/Nature))' : ' (Martial Weapons, Medium Armor)'));
    }
    if(cl.id==='barbarian' && state.primalKnowledgeSkill){
      classFeaturesInner += wPara(`Primal Knowledge: ${state.primalKnowledgeSkill}`);
    }
    if(cl.id==='sorcerer' && state.elementalAffinityChoice){
      classFeaturesInner += wPara(`Elemental Affinity: ${state.elementalAffinityChoice} (Resistenz, +CHA-Mod auf einen Schadenswurf)`);
    }
    if(cl.id==='bard' && state.moonPrimalLoreCantrip){
      classFeaturesInner += wPara(`Primal Lore: ${state.moonPrimalLoreCantrip} (Druid-Cantrip, zählt als Bard-Zauber)`);
    }
    Object.entries(state.maneuverChoices).filter(([k,_])=>k.startsWith(cl.id+'__man__')).forEach(([k,arr])=>{
      if(arr && arr.length){
        const withPages = arr.map(name=>{
          const mdef = DATA.battleMasterManeuvers.find(m=>m.name===name);
          return mdef ? name+pageRefSuffix(mdef) : name;
        });
        classFeaturesInner += wPara(`Maneuvers: ${withPages.join(', ')}`);
      }
    });
    const invKeyDoc = cl.id+'__inv';
    if(state.invocationChoices[invKeyDoc] && state.invocationChoices[invKeyDoc].length){
      classFeaturesInner += wPara(`Eldritch Invocations: ${formatInvocationList(state.invocationChoices[invKeyDoc])}`);
      if(state.invocationChoices[invKeyDoc].includes('Lessons of the First Ones') && state.warlockLessonsFeat && state.warlockLessonsFeat.name){
        classFeaturesInner += wPara(`Lessons of the First Ones – Origin Feat: ${describeFeatChoice(state.warlockLessonsFeat)}`);
      }
    }
    const metaKeyDoc = cl.id+'__meta';
    if(state.metamagicChoices[metaKeyDoc] && state.metamagicChoices[metaKeyDoc].length){
      classFeaturesInner += wPara(`Metamagic: ${state.metamagicChoices[metaKeyDoc].join(', ')}`);
    }
    Object.entries(state.subclassChoiceOptions).filter(([k,_])=>k.startsWith(cl.id+'__sc__')).forEach(([k,v])=>{
      if(v) classFeaturesInner += wPara(`Subklassen-Wahl: ${v}`);

  x += wBox('CLASS FEATURES', classFeaturesInner);

  // ---- Species Traits & Feats ----
  const speciesTraitsPlain = htmlBlockToLines(renderSpeciesTraitsForSummary(sp) + resolveSpeciesSubChoiceDetails());
  x += wBox(`SPECIES TRAITS${pageRefSuffix(sp)}`, speciesTraitsPlain.map(line=>wPara(line)).join(''));

  let featsInner = wPara([{text:'Hintergrund: ', bold:true}, {text: describeFeatChoice({name:bg.feat, sub: state.backgroundFeatSubChoice})}]);

  x += wBox('FEATS', featsInner);

  // ---- Spellcasting ----
  const primaryCaster = state.classes.find(cl=>getEffectiveSpellcasting(cl));
  if(primaryCaster){
    const eff = getEffectiveSpellcasting(primaryCaster);
    const abilMod = mod(finalScores[eff.ability]);

  }

  // ---- Size / Carrying / Jump ----

  x += wBox('SIZE / CARRYING CAPACITY / JUMP', wPara(`Size: ${resolveSpeciesSize(sp)}   Carrying Cap.: ${strScore*15} lb   High Jump: ${3+mod(strScore)} ft   Long Jump: ${strScore} ft`));

  // ---- Equipment & Coins ----

  x += wBox('EQUIPMENT', equipInner);

  const remaining = (totalAvailableGold() - cartTotal()).toFixed(2);
  x += wBox('COINS', wPara(`${remaining} GP (Budget: ${totalAvailableGold()} GP)`));

  x += wPara('Erstellt mit dem D&D-2024-Charakter-Generator (V5). Bitte alle Werte in deinen offiziellen Charakterbogen übertragen und mit deinem DM abstimmen.', {spacingAfter:0});

  downloadDocx(x, (state.charName||'charakter')+'.docx');
}

// Consolidated spell list, rendered as real docx paragraphs/headings (mirrors renderSpellListSection).
function spellListXml(){
  const entries = collectAllKnownSpells();
  if(entries.length===0) return '';
  const graded = entries.filter(e=>typeof e.grade==='number');
  const ungraded = entries.filter(e=>typeof e.grade!=='number');
  const maxGrade = graded.reduce((m,e)=>Math.max(m,e.grade), 3);
  const gradeLabels = {0:'Zaubertricks',1:'Grad 1',2:'Grad 2',3:'Grad 3',4:'Grad 4',5:'Grad 5',6:'Grad 6',7:'Grad 7',8:'Grad 8',9:'Grad 9'};
  let x = wPara('ZAUBERLISTE (ALLE QUELLEN)', {heading:'Heading1'});
  for(let g=0; g<=maxGrade; g++){
    const list = alphaSort(graded.filter(e=>e.grade===g), e=>e.name);
    if(!list.length) continue;
    x += wBox(gradeLabels[g], list.map(e=>wBullet(`${e.name} — ${e.source}, ${e.status}`)).join(''));
  }
  if(ungraded.length){
    x += wBox('Sonstige (Grad unbekannt)', alphaSort(ungraded, e=>e.name).map(e=>wBullet(`${e.name} — ${e.source}, ${e.status}`)).join(''));
  }
  const casterNotesXml = spellCasterClasses().map(cl=>{
    const eff = getEffectiveSpellcasting(cl);
    const cn = spellcastingCategoryNote(eff);
    return cn.note ? {name:classDef(cl.id).name, note:cn.note} : null;
  }).filter(Boolean);
  if(casterNotesXml.length){
    x += casterNotesXml.map(cn => wPara([{text: cn.name+': ', bold:true, size:16}, {text: cn.note, size:16}], {spacingAfter:40})).join('');
  }
  return x;
}

// Converts a Uint8Array to a base64 string safely, chunked to avoid call-stack limits on
// large binary payloads (String.fromCharCode.apply would blow the stack on big docx files).
function bytesToBase64(bytes){
  let binary = '';
  const chunkSize = 0x8000;
  for(let i=0; i<bytes.length; i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}

// Triggers a file download via a base64 data: URI rather than a blob: URL. Blob URLs require
// the browser to resolve an in-memory object reference, which Android WebView (and WKWebView-
// based "open in app" viewers on iOS) frequently cannot do — the click silently does nothing.
// A data: URI embeds the bytes directly in the URL string, so there's nothing to resolve.
function downloadBlob(content, filename, mime){
  let base64;
  if(content instanceof Uint8Array){
    base64 = bytesToBase64(content);
  } else {
    // Text content: encode as UTF-8 bytes first, then base64, so non-ASCII characters
    // (ä/ö/ü/ß etc., common throughout our German text) survive correctly.
    base64 = bytesToBase64(new TextEncoder().encode(content));
  }
  const dataUri = 'data:'+mime+';base64,'+base64;
  const a = document.createElement('a');
  a.href = dataUri; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
}
