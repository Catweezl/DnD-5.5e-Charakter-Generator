        <h4>${cdef.name} Stufe ${d.level} – ${d.label}</h4>
        <select data-subclasschoice="${d.key}">
          <option value="">--wählen--</option>
          ${d.options.map(o=>`<option value="${o}" ${current===o?'selected':''}>${o}</option>`).join('')}
        </select>
      </div>`;
    } else if(d.type==='loreskills'){
      const alreadyProf = skillsAlreadyProficientSoFar(d.classId);
      const pool = SKILLS.filter(s=>!alreadyProf.has(s));
      const current = state.loreBonusSkills[d.key] || [];
      html += `<div class="choice-box">
        <h4>${cdef.name} – Bonus Proficiencies (${d.count} Fertigkeiten)</h4>
        <p style="font-size:0.8em;color:var(--muted);">Fertigkeiten, die du bereits hast, sind hier ausgeblendet.</p>
        <div id="loreskills_${d.key}_container">${renderDedupSelects('loreskills_'+d.key, d.count, pool, current)}</div>
      </div>`;
    } else if(d.type==='loremagic'){
      const combinedPool = alphaSort([...new Set([
        ...DATA.spellsByClass.cleric.cantrips, ...DATA.spellsByClass.cleric.level1, ...DATA.spellsByClass.cleric.level2, ...DATA.spellsByClass.cleric.level3,
        ...DATA.spellsByClass.druid.cantrips, ...DATA.spellsByClass.druid.level1, ...DATA.spellsByClass.druid.level2, ...DATA.spellsByClass.druid.level3,
        ...DATA.spellsByClass.wizard.cantrips, ...DATA.spellsByClass.wizard.level1, ...DATA.spellsByClass.wizard.level2, ...DATA.spellsByClass.wizard.level3
      ])]);
      const current = state.loreMagicalDiscoveries[d.key] || [];
      html += `<div class="choice-box">
        <h4>${cdef.name} – Magical Discoveries (${d.count} Zauber, Cleric/Druid/Wizard-Liste)</h4>
        <p style="font-size:0.8em;color:var(--muted);">Zaubertrick oder Zauber für den du Slots hast. Immer vorbereitet, unabhängig vom normalen Zauber-Limit.</p>
        <div id="loremagic_${d.key}_container">${renderDedupSelects('loremagic_'+d.key, d.count, combinedPool, current)}</div>
      </div>`;
    } else if(d.type==='savant'){
      const schoolPool = alphaSort([...DATA.spellsByClass.wizard.level1, ...DATA.spellsByClass.wizard.level2].filter(s=>s.includes('('+d.school+')')));
      const current = state.savantChoices[d.key] || [];
      html += `<div class="choice-box">
        <h4>${cdef.name} – ${d.school} Savant (${d.count} Zauber, Grad max. 2, kostenlos ins Spellbook)</h4>
        <div id="savant_${d.key}_container">${renderDedupSelects('savant_'+d.key, d.count, schoolPool, current)}</div>
      </div>`;
    }
  });

  html += `<div style="margin-top:16px;">
      <button class="secondary" onclick="goTo(STEP.HP)">← Zurück</button>
      <button onclick="tryNextFromLevelUp()">Weiter →</button>
    </div></div>`;
  return html;
}

function renderAsiFeatBox(d){
  const cdef = classDef(d.classId);
  const stored = (state.levelUpChoices[d.classId] && state.levelUpChoices[d.classId][d.level]) || {};
  const mode = stored.mode || '';
  let html = `<div class="choice-box">
    <h4>${cdef.name} Stufe ${d.level} – Ability Score Improvement oder Feat</h4>
    <div>
      <button class="small ${mode==='asi'?'':'secondary'}" data-asifeatmode="${d.key}|asi">ASI (Attribute erhöhen)</button>
      <button class="small ${mode==='feat'?'':'secondary'}" data-asifeatmode="${d.key}|feat">Anderes Feat wählen</button>
    </div>
    <div id="asifeat_detail_${d.key}">${renderAsiFeatDetail(d, stored)}</div>
  </div>`;
  return html;
}

function renderAsiFeatDetail(d, stored){
  if(stored.mode==='asi'){
    const dist = stored.asi && stored.asi.distribution || '';
    const abilities = (stored.asi && stored.asi.abilities) || [];
    let html = `<div style="margin-top:10px;">
      <label style="display:inline-block;margin-right:10px;"><input type="radio" name="dist_${d.key}" value="plus2" ${dist==='plus2'?'checked':''} onchange="setAsiDistribution('${d.key}','plus2')"> +2 auf ein Attribut</label>
      <label style="display:inline-block;"><input type="radio" name="dist_${d.key}" value="plus1plus1" ${dist==='plus1plus1'?'checked':''} onchange="setAsiDistribution('${d.key}','plus1plus1')"> +1 auf zwei Attribute</label>`;
    if(dist==='plus2'){
      html += `<div style="margin-top:8px;"><select data-asiability1="${d.key}">
        <option value="">--Attribut wählen--</option>
        ${ABILITIES.map(a=>`<option value="${a}" ${abilities[0]===a?'selected':''}>${ABIL_DE[a]}</option>`).join('')}
      </select></div>`;
    } else if(dist==='plus1plus1'){
      html += `<div style="margin-top:8px;" class="grid">
        <select data-asiability1="${d.key}">
          <option value="">--Attribut 1--</option>
          ${ABILITIES.filter(a=>a!==abilities[1]).map(a=>`<option value="${a}" ${abilities[0]===a?'selected':''}>${ABIL_DE[a]}</option>`).join('')}
        </select>
        <select data-asiability2="${d.key}">
          <option value="">--Attribut 2--</option>
          ${ABILITIES.filter(a=>a!==abilities[0]).map(a=>`<option value="${a}" ${abilities[1]===a?'selected':''}>${ABIL_DE[a]}</option>`).join('')}
        </select>
      </div>`;
    }
    html += `</div>`;
    return html;
  } else if(stored.mode==='feat'){
    const chosenFeatName = stored.feat && stored.feat.name || '';
    const availableFeats = alphaSort(DATA.feats_general.filter(f=>f.name!=='Ability Score Improvement' && (!f.settingLocked || state.allowOtherSettingContent)), f=>f.name);
    const chosenOriginFeats = gatherChosenOriginFeatNames();
    let html = `<div style="margin-top:10px;">
      <p style="font-size:0.8em;color:var(--muted);">Nicht erfüllbare Feats sind deaktiviert, mit Hinweis, was fehlt.</p>
      <select data-featselect="${d.key}">
        <option value="">--Feat wählen--</option>
        ${availableFeats.map(f=>{
          const chain = GENERAL_FEAT_CHAIN_PREREQS[f.name];
          let blocked = false, missingLabel = '';
          if(chain){
            const hasOriginFeat = chosenOriginFeats.has(chain.originFeat);
            const hasAlt = chain.altCheck ? chain.altCheck() : false;
            blocked = !hasOriginFeat && !hasAlt && f.name !== chosenFeatName;
            if(blocked) missingLabel = chain.altLabel ? ` [fehlt: ${chain.originFeat} oder ${chain.altLabel}]` : ` [fehlt: ${chain.originFeat}]`;
          }
          return `<option value="${f.name}" ${chosenFeatName===f.name?'selected':''} ${blocked?'disabled':''}>${f.name} (General, ${f.sourceTag||'PHB'})${missingLabel}</option>`;
        }).join('')}
      </select>`;
    if(chosenFeatName){
      const featDef = availableFeats.find(f=>f.name===chosenFeatName);
      html += `<div class="info-box">${sourceBadge(featDef)}${featDef.desc}</div>`;
      if(!stored.feat.sub) stored.feat.sub = {};
      html += renderFeatSubChoiceUI(featDef, d.key, stored.feat.sub);
    }
    html += `</div>`;
    return html;
  }
  return '';
}

// Render sub-choice UI for a feat's "choice" definition. storageKeyPrefix uniquely identifies this feat instance.
// forcedClass: when set (e.g. background feat "Magic Initiate (Wizard)" already specifies the class),
// the class dropdown is skipped and that class is used directly.
// featDef.choice can be a single choice object OR an array of them (e.g. Elemental Adept needs both
// an ability-score choice AND a damage-type choice) — each choice type stores under its own distinct
// currentSub property (ability/damageType/picks/etc.), so looping and concatenating is safe.
function renderFeatSubChoiceUI(featDef, storageKeyPrefix, currentSub, forcedClass){
  if(Array.isArray(featDef.choice)){
    return featDef.choice.map(c=>renderSingleFeatChoiceUI(c, storageKeyPrefix, currentSub, forcedClass)).join('');
  }
  return renderSingleFeatChoiceUI(featDef.choice, storageKeyPrefix, currentSub, forcedClass);
}
function renderSingleFeatChoiceUI(c, storageKeyPrefix, currentSub, forcedClass){
  if(!c) return '';
  if(c.type==='ability'){
    if(c.options.length===1 && c.options[0]!=='all'){
      // Auto-apply the single option directly into the (live-referenced) storage object,
      // otherwise this bonus would silently never be recorded anywhere.
      currentSub.ability = c.options[0];
      return `<p style="font-size:0.85em;">Automatisch: ${c.label} (${ABIL_DE[c.options[0]]||c.options[0]})</p>`;
    }
    return `<div><label style="font-weight:normal;">${c.label}</label>
      <select data-featsub-ability="${storageKeyPrefix}">
        <option value="">--wählen--</option>
        ${c.options.map(o=> o==='all' ? ABILITIES.map(a=>`<option value="${a}" ${currentSub.ability===a?'selected':''}>${ABIL_DE[a]}</option>`).join('') : `<option value="${o}" ${currentSub.ability===o?'selected':''}>${ABIL_DE[o]||o}</option>`).join('')}
      </select></div>`;
  }
  if(c.type==='skillOrTool'){
    const alreadyProf = skillsAlreadyProficientSoFar();
    const pool = alphaSort(skillOrToolPool().filter(item => !alreadyProf.has(item)));
    const picks = currentSub.picks || [];
    return `<div><label style="font-weight:normal;">${c.label}</label>
      <p style="font-size:0.78em;color:var(--muted);margin:2px 0;">Fertigkeiten, in denen du schon Proficiency hast, sind hier nicht mehr wählbar.</p>
      <div id="${storageKeyPrefix}_skilltool_container">${renderDedupSelects(storageKeyPrefix+'_st', c.count, pool, picks)}</div></div>`;
  }
  if(c.type==='skillFromList'){
    const alreadyProf = skillsAlreadyProficientSoFar();
    const pool = alphaSort(c.options.filter(item => !alreadyProf.has(item)));
    const picks = currentSub.picks || [];
    return `<div><label style="font-weight:normal;">${c.label}</label>
      <div id="${storageKeyPrefix}_skilltool_container">${renderDedupSelects(storageKeyPrefix+'_st', c.count, pool, picks)}</div></div>`;
  }
  if(c.type==='tool'){
    const pool = alphaSort(allToolNames());
    const picks = currentSub.picks || [];
    return `<div><label style="font-weight:normal;">${c.label}</label><div>${renderDedupSelects(storageKeyPrefix+'_tool', c.count, pool, picks)}</div></div>`;
  }
  if(c.type==='instrument'){
    const picks = currentSub.picks || [];
    return `<div><label style="font-weight:normal;">${c.label}</label><div>${renderDedupSelects(storageKeyPrefix+'_instr', c.count, alphaSort(INSTRUMENT_NAMES), picks)}</div></div>`;
  }
  if(c.type==='weapon'){
    const picks = currentSub.picks || [];
    return `<div><label style="font-weight:normal;">${c.label}</label><div>${renderDedupSelects(storageKeyPrefix+'_wpn', c.count, alphaSort(allWeaponNames()), picks)}</div></div>`;
  }
  if(c.type==='damageType'){
    return `<div><label style="font-weight:normal;">${c.label}</label>
      <select data-featsub-dmgtype="${storageKeyPrefix}">
        <option value="">--wählen--</option>
        ${c.options.map(o=>`<option value="${o}" ${currentSub.damageType===o?'selected':''}>${o}</option>`).join('')}
      </select></div>`;
  }
  if(c.type==='magicInitiate'){
    let chosenClass = forcedClass || currentSub.magicClass || (c.classes.length===1 ? c.classes[0] : '');
    let classPickerHtml;
    if(forcedClass){
      classPickerHtml = `<p style="font-size:0.85em;">Klasse (durch den Hintergrund vorgegeben): <b>${classDef(forcedClass).name}</b></p>`;
    } else if(c.classes.length===1){
      classPickerHtml = `<p style="font-size:0.85em;">Zauberliste (durch dieses Feat vorgegeben): <b>${classDef(c.classes[0]).name}</b></p>`;
    } else {
      classPickerHtml = `<div><label style="font-weight:normal;">Klasse für Magic Initiate</label>
        <select data-featsub-miclass="${storageKeyPrefix}">
          <option value="">--wählen--</option>
          ${c.classes.map(cl=>`<option value="${cl}" ${chosenClass===cl?'selected':''}>${classDef(cl).name}</option>`).join('')}
        </select></div>`;
    }
    let html = classPickerHtml;
    if(chosenClass){
      const pool = DATA.spellsByClass[chosenClass];
      const cantripPicks = currentSub.cantrips || [];
      const l1Picks = currentSub.level1 || [];
      if(c.cantripCount>0){
        html += `<div style="margin-top:8px;"><label style="font-weight:normal;">${c.cantripCount} Zaubertricks</label>
          ${renderDedupSelects(storageKeyPrefix+'_micantrip', c.cantripCount, pool.cantrips, cantripPicks)}</div>`;
      }
      html += `<div style="margin-top:8px;"><label style="font-weight:normal;">${c.level1Count} Level-1-Zauber</label>
        ${renderDedupSelects(storageKeyPrefix+'_mil1', c.level1Count, pool.level1, l1Picks)}</div>`;
    }
    return html;
  }
  if(c.type==='spellFromSchools'){
    // Builds a pool of grade-1 spells (from ANY class list) whose school tag matches c.schools,
    // e.g. Fey-Touched (Divination/Enchantment) and Shadow-Touched (Illusion/Necromancy).
    const seen = new Set();
    const pool = [];
    Object.values(DATA.spellsByClass).forEach(clsPool=>{
      (clsPool.level1||[]).forEach(name=>{
        const m = name.match(/\(([^)]+)\)\s*(\(HoF\))?$/);
        const school = m ? m[1] : '';
        if(c.schools.includes(school) && !seen.has(name)){
          seen.add(name);
          pool.push(name);
        }
      });
    });
    pool.sort();
    const picked = currentSub.schoolSpell || '';
    return `<div><label style="font-weight:normal;">${c.label}</label>
      <select data-featsub-schoolspell="${storageKeyPrefix}">
        <option value="">--wählen--</option>
        ${pool.map(name=>`<option value="${name}" ${picked===name?'selected':''}>${name}</option>`).join('')}
      </select></div>`;
  }
  if(c.type==='ritualCaster'){
    // Count scales with the character's CURRENT total-level Proficiency Bonus (2-6), not the level
    // at which the feat was taken — matches the PHB rule that this grows automatically as PB rises.
    const count = proficiencyBonusForLevel(state.level);
    const picks = currentSub.ritualSpells || [];
    return `<div><label style="font-weight:normal;">${c.label} — aktuell ${count} Zauber (Proficiency Bonus +${count})</label>
      <div>${renderDedupSelects(storageKeyPrefix+'_ritual', count, alphaSort(c.pool), picks)}</div></div>`;
  }
  if(c.type==='asi'){
    return ''; // handled elsewhere (shouldn't occur since we exclude ASI feat from list)
  }
  return '';
}

function splitKey(key){
  const parts = key.split('__');
  const classId = parts[0];
  const level = parseInt(parts[1], 10);
  return [classId, level];
}
function ensureLevelUpEntry(classId, level){
  if(!state.levelUpChoices[classId]) state.levelUpChoices[classId] = {};
  if(!state.levelUpChoices[classId][level]) state.levelUpChoices[classId][level] = {};
}
function setAsiDistribution(key, dist){
  const [classId, level] = splitKey(key);
  const entry = state.levelUpChoices[classId][level];
  entry.asi = {distribution: dist, abilities: []};
  render();
}
function getFeatSubStorage(storageKeyPrefix){
  // storageKeyPrefix format: classId_level (the decision key)
  const [classId, level] = splitKey(storageKeyPrefix);
  const entry = state.levelUpChoices[classId][level];
  if(!entry.feat.sub) entry.feat.sub = {};
  return entry.feat.sub;
}

function setupAllDedupHandlersForFeatSubs(){
  document.querySelectorAll('.choice-box').forEach(box=>{});
  // Attach change handlers generically for any select whose id matches pattern used by renderDedupSelects
  document.querySelectorAll('select[id*="_st_"], select[id*="_tool_"], select[id*="_instr_"], select[id*="_wpn_"], select[id*="_micantrip_"], select[id*="_mil1_"]').forEach(el=>{
    el.onchange = ()=> onGenericFeatDedupChange(el);
  });
}
function onGenericFeatDedupChange(el){
  const id = el.id; // e.g. barbarian_4_st_0  or  barbarian_4_micantrip_1
  const m = id.match(/^(.+)_(st|tool|instr|wpn|micantrip|mil1|ritual)_(\d+)$/);
  if(!m) return;
  const storageKeyPrefix = m[1];
  const kind = m[2];
  const [classId, level] = splitKey(storageKeyPrefix);
  const entry = state.levelUpChoices[classId][level];
  const sub = entry.feat.sub;
  let arrName = {st:'picks', tool:'picks', instr:'picks', wpn:'picks', micantrip:'cantrips', mil1:'level1', ritual:'ritualSpells'}[kind];
  const count = document.querySelectorAll(`select[id^="${storageKeyPrefix}_${kind}_"]`).length;
  const arr = [];
  for(let i=0;i<count;i++){
    const s = document.getElementById(storageKeyPrefix+'_'+kind+'_'+i);
    if(s && s.value) arr[i] = s.value;
  }
  sub[arrName] = arr.filter(Boolean);
  render();
}

    if(d.type==='primalorder' && !state.primalOrderChoice){ alert('Bitte Primal Order wählen (Magician oder Warden).'); return; }
    if(d.type==='primalknowledge' && !state.primalKnowledgeSkill){ alert('Bitte einen Skill für Primal Knowledge wählen.'); return; }
    if(d.type==='extratool' && !state.knowledgeDomainToolChoice){ alert("Bitte ein Artisan's-Tools-Werkzeug für Blessings of Knowledge wählen."); return; }
    if(d.type==='elementalaffinity' && !state.elementalAffinityChoice){ alert('Bitte einen Schadenstyp für Elemental Affinity wählen.'); return; }
    if(d.type==='moonlore' && !state.moonPrimalLoreCantrip){ alert('Bitte einen Druid-Cantrip für Primal Lore wählen.'); return; }

    }

      if(picked.includes('Lessons of the First Ones') && (!state.warlockLessonsFeat || !state.warlockLessonsFeat.name)){
        alert('Bitte für "Lessons of the First Ones" den zusätzlichen Origin Feat wählen.'); return;
      }

// compute final ability scores after ASI + feat sub-ability boosts applied
function computeFinalAbilityScores(){
  const scores = {...state.abilityScores};
  Object.values(state.levelUpChoices).forEach(byLevel=>{
    Object.values(byLevel).forEach(entry=>{
      if(entry.mode==='asi' && entry.asi){
        if(entry.asi.distribution==='plus2' && entry.asi.abilities[0]){
          scores[entry.asi.abilities[0]] = Math.min(20, (scores[entry.asi.abilities[0]]||10)+2);
        } else if(entry.asi.distribution==='plus1plus1'){
          (entry.asi.abilities||[]).forEach(a=>{ if(a) scores[a] = Math.min(20, (scores[a]||10)+1); });
        }
      }
      if(entry.mode==='feat' && entry.feat && entry.feat.sub && entry.feat.sub.ability){
        const a = entry.feat.sub.ability;
        if(ABILITIES.includes(a)) scores[a] = Math.min(20, (scores[a]||10)+1);
      }
    });
  });
  // background ability picks applied later in summary via separate function combining both
  return scores;
}
// ---------- STEP 5: SPELLS ----------
// Which Warlock cantrips are eligible targets for the three "pick a cantrip" invocations
// (2024 PHB: these apply to ANY known Warlock cantrip meeting the criteria, not just
// Eldritch Blast as in 2014). Keyed by invocation name -> array of eligible cantrip names.
const WARLOCK_INVOCATION_CANTRIP_TARGETS = {
  'Agonizing Blast': ['Chill Touch','Eldritch Blast','Mind Sliver','Poison Spray','Thunderclap','Toll the Dead'],
  'Repelling Blast': ['Chill Touch','Eldritch Blast'],
  'Eldritch Spear': ['Eldritch Blast']
};
// Cross-class damage cantrips that are NOT on the core Warlock list, so they only count if
// learned via Pact of the Tome specifically — PHB explicitly says those "function as Warlock
// spells for you", a clause Magic Initiate lacks (confirmed via D&D Beyond rules discussions).
const PACT_TOME_ONLY_CANTRIP_TARGETS = {
  'Agonizing Blast': ['Acid Splash','Create Bonfire','Fire Bolt','Frostbite','Produce Flame','Ray of Frost','Sacred Flame','Shocking Grasp','Thorn Whip','Vicious Mockery'],
  'Repelling Blast': ['Fire Bolt','Produce Flame','Ray of Frost','Shocking Grasp','Thorn Whip'],
  'Eldritch Spear': ['Fire Bolt','Ray of Frost']
};
// Combines both tiers into the actual eligible pool for a given invocation: core Warlock-list
// cantrips count regardless of source, cross-class ones only count if picked via Pact of the Tome.
function computeEligibleCantripsForInvocation(invName){
  const known = gatherAllKnownCantripNamesForWarlock();
  const pactToneNames = (state.pactOfTomeChoices.cantrips||[]).filter(Boolean);
  const eligible = [];
  (WARLOCK_INVOCATION_CANTRIP_TARGETS[invName]||[]).forEach(plain=>{
    const m = findKnownCantripMatch(plain, known);
    if(m && !eligible.includes(m)) eligible.push(m);
  });
  (PACT_TOME_ONLY_CANTRIP_TARGETS[invName]||[]).forEach(plain=>{
    const m = findKnownCantripMatch(plain, pactToneNames);
    if(m && !eligible.includes(m)) eligible.push(m);
  });
  return eligible;
}
// Cantrip names in our spell pools are stored with a "(School)" suffix, e.g. "Eldritch Blast
// (Evocation)" — match by prefix so the plain names above keep working regardless of that suffix.
function findKnownCantripMatch(plainName, knownCantrips){
  return knownCantrips.find(c=>c===plainName || c.startsWith(plainName+' ('));
}
// Any cantrip granted via Magic Initiate (Human Versatile, Background Feat, or Warlock's own
// "Lessons of the First Ones" invocation) counts too if it happens to be on the Warlock cantrip
// list — the PHB only requires "a known Warlock cantrip", not one learned specifically through
// the Pact Magic class feature. So the eligible pool for Agonizing Blast etc. must include these.
// Pact of the Tome cantrips are different: PHB says they "function as Warlock spells for you",
// so ALL three count regardless of whether they're on the core Warlock list (unlike Magic Initiate).
function gatherAllKnownCantripNamesForWarlock(){
  const names = new Set(((state.spellSelections.warlock||{}).cantrips)||[]);
  [state.backgroundFeatSubChoice, state.speciesExtraFeat && state.speciesExtraFeat.sub, state.warlockLessonsFeat && state.warlockLessonsFeat.sub]
    .forEach(sub=>{ if(sub && sub.magicClass) (sub.cantrips||[]).forEach(c=>names.add(c)); });
  (state.pactOfTomeChoices.cantrips||[]).forEach(c=>{ if(c) names.add(c); });
  return [...names];
}
// Union of every class's cantrip list, for Pact of the Tome's "any class's spell list" cantrip pool.
function allCantripsAcrossClasses(){
  const set = new Set();
  Object.values(DATA.spellsByClass).forEach(pool=>(pool.cantrips||[]).forEach(c=>set.add(c)));
  return alphaSort([...set]);
}
// Manually curated, cross-checked-against-our-database list of level-1 Ritual-tagged spells
// (our spell pools don't track the Ritual tag separately, so this is a best-effort static list).
const LEVEL1_RITUAL_SPELLS = ['Alarm (Abjuration)','Comprehend Languages (Divination)','Detect Magic (Divination)','Find Familiar (Conjuration)','Identify (Divination)','Illusory Script (Illusion)','Purify Food and Drink (Transmutation)','Unseen Servant (Conjuration)'];

function maxSpellLevelAvailable(classId, classLevel){
  if(classId==='warlock') return Math.min(3, Math.ceil(classLevel/2)); // capped to 3 since DB only has up to grade 3
  if(classId==='artificer'){
    if(classLevel>=9) return 3;
    if(classLevel>=5) return 2;
    if(classLevel>=1) return 1;
    return 0;
  }
  if(HALF_CASTERS.includes(classId)){
    if(classLevel>=9) return 3;
    if(classLevel>=5) return 2;
    if(classLevel>=2) return 1;
    return 0;
  }
  if(classLevel>=5) return 3;
  if(classLevel>=3) return 2;
  if(classLevel>=1) return 1;
  return 0;
}
function maxSpellLevelForSubclassCaster(classLevel){
  // Eldritch Knight / Arcane Trickster style third-casters (capped at grade 3 since our DB only goes that far)
  if(classLevel>=13) return 3;
  if(classLevel>=7) return 2;
  if(classLevel>=3) return 1;
  return 0;
}

// Returns effective spellcasting info for a class instance, whether granted by the base class
// or by a chosen subclass (e.g. Fighter/Eldritch Knight, later Rogue/Arcane Trickster).
function getEffectiveSpellcasting(cl){
  const cdef = classDef(cl.id);
  if(cdef.spellcasting) return {source:'class', ability: cdef.spellcasting.ability, type: cdef.spellcasting.type, spellList: cl.id};
  const subclass = state.subclassChoices[cl.id];
  const subDetails = cdef.subclassDetails && subclass && cdef.subclassDetails[subclass];
  if(subDetails && subDetails.spellTable){
    return {source:'subclass', subclass, ability: subDetails.spellAbility, type:'prepared (aus Subklasse '+subclass+')', spellList: subDetails.spellList, spellTable: subDetails.spellTable};
  }
  return null;
}

// Translates the (fairly free-text) spellcasting.type field into a UI label + explanatory note,
// so players don't mistake a "prepared from the full class list" caster (Cleric/Druid/Paladin/
// Ranger/Artificer) for a "known spells" caster (Sorcerer/Bard/Warlock) — the former can swap
// their entire selection after every Long Rest since they conceptually know the whole class list,
// while the latter's selection is durable and only changes at specific level-up opportunities.
function spellcastingCategoryNote(eff){
  // Eldritch Knight / Arcane Trickster: NOT a full-class-list preparer despite the word "prepared"
  // in their type string — they only ever know a small, chosen subset of the Wizard list.
  if(eff.source === 'subclass'){
    return {
      label: 'Bekannte Zauber (begrenzte Auswahl)',
      note: 'Du kennst nur diese begrenzte Auswahl (keinen Zugriff auf die volle Zauberliste). Änderbar nur bei Level-Up-Gelegenheiten (siehe PHB).'
    };
  }
  const t = eff.type || '';
  if(t.includes('Pact Magic')){
    return {
      label: 'Bekannte Zauber (Pact Magic)',
      note: 'Diese Zauber kennst du dauerhaft (nur bei Level-Up-Gelegenheiten tauschbar). Deine Pact-Magic-Slots regenerieren schon nach einer kurzen Rast, nicht erst nach einer langen.'
    };
  }
  if(t.includes('Spellbook')){
    return {
      label: 'Vorbereitete Zauber (aus dem Spellbook)',
      note: 'Diese Auswahl ist deine heutige Vorbereitung aus deinem Spellbook – nach jeder Long Rest frei änderbar. Neue Zauber ins Spellbook aufnehmen (z.B. beim Level-Up oder durch Schriftrollen) ist ein separater Vorgang, siehe PHB.'
    };
  }
  if(t.startsWith('known')){
    return {
      label: 'Bekannte Zauber',
      note: 'Diese Zauber kennst du dauerhaft (nur bei Level-Up-Gelegenheiten tauschbar, siehe PHB).'
    };
  }
  if(t.includes('prepared')){
    return {
      label: 'Vorbereitete Zauber',
      note: 'Du kennst die komplette Klassen-Zauberliste; dies ist nur deine heutige Auswahl, nach jeder Long Rest frei änderbar.'
    };
  }
  return {label: 'Zauber', note: ''};
}

function spellCasterClasses(){
  return state.classes.filter(cl=> getEffectiveSpellcasting(cl) !== null);
}

function getSpellCountsForClass(cl){
  const eff = getEffectiveSpellcasting(cl);
  if(!eff) return {cantripCount:0, spellCount:0};
  if(eff.source === 'subclass'){
    const row = eff.spellTable[String(cl.level)];
    return {cantripCount: row?row.cantrips:0, spellCount: row?row.prepared:0};
  }
  const classId = cl.id, classLevel = cl.level;
  const abilityScoresNow = computeFinalAbilityScores();
  const abilityMod = mod(abilityScoresNow[eff.ability]);
  let cantripCount = 0;
  if(DATA.cantripsKnownByLevel[classId]) cantripCount = DATA.cantripsKnownByLevel[classId][classLevel-1];
  if(classId==='cleric' && state.divineOrderChoice==='Thaumaturge') cantripCount += 1;
  if(classId==='druid' && state.primalOrderChoice==='Magician') cantripCount += 1;
  let spellCount = 0;
  if(DATA.preparedSpellsTableByLevel[classId]){
    spellCount = DATA.preparedSpellsTableByLevel[classId][classLevel-1];
  } else if(DATA.preparedFormulaClasses[classId]){
    const f = DATA.preparedFormulaClasses[classId];
    const effLevel = f.roundDown ? Math.floor(classLevel/f.levelDivisor) : classLevel;
    spellCount = Math.max(1, effLevel + abilityMod);
  }
  return {cantripCount, spellCount};
}

function renderSpellStep(){
  const casters = spellCasterClasses();
  if(casters.length===0){
    return `<div class="panel">
      <h2>Schritt 8: Zauber</h2>
      <p style="color:var(--muted)">Keine deiner gewählten Klassen wirkt Zauber.</p>
      <div style="margin-top:16px;">
        <button class="secondary" onclick="goTo(STEP.DECISIONS)">← Zurück</button>
        <button onclick="goTo(STEP.EQUIPMENT)">Weiter →</button>
      </div>
    </div>`;
  }
  let html = `<div class="panel"><h2>Schritt 8: Zauber</h2>
    <p style="font-size:0.85em;color:var(--muted);">Zaubertricks und Grad-1-bis-3-Zauber (Name + Schule). Höhere Grade und Beschreibungstexte sind in dieser Version nicht enthalten – bitte im PHB nachschlagen.</p>`;

  casters.forEach(cl=>{
    const cdef = classDef(cl.id);
    const eff = getEffectiveSpellcasting(cl);
    const {cantripCount, spellCount} = getSpellCountsForClass(cl);
    const pool = DATA.spellsByClass[eff.spellList];
    const maxLvl = eff.source==='subclass' ? maxSpellLevelForSubclassCaster(cl.level) : maxSpellLevelAvailable(cl.id, cl.level);
    const sel = state.spellSelections[cl.id] || {cantrips:[], spells:[]};
    state.spellSelections[cl.id] = sel;

    html += `<div class="choice-box"><h4>${cdef.name}${eff.subclass?' ('+eff.subclass+')':''} (Stufe ${cl.level}) – ${eff.ability} als Zauberfertigkeit${eff.source==='subclass'?', Zauber aus der '+({wizard:'Wizard'}[eff.spellList]||eff.spellList)+'-Liste':''}</h4>`;

    if(cantripCount>0){
      html += `<label style="font-weight:normal;">Zaubertricks: <span id="cantripcount_${cl.id}">${sel.cantrips.length}</span> / ${cantripCount}</label>
        <div class="checklist">`;
      alphaSort(pool.cantrips).forEach(sp=>{
        const checked = sel.cantrips.includes(sp);
        html += `<label><input type="checkbox" data-spellcheck="${cl.id}|cantrip|${cantripCount}" value="${sp}" ${checked?'checked':''}> ${sp}</label>`;
      });
      html += `</div>`;

      // Warlock-only: Pact of the Tome grants 3 cantrips + 2 ritual level-1 spells from ANY
      // class's spell list, and PHB explicitly says they "function as Warlock spells for you" —
      // unlike Magic Initiate, so ALL three count for Agonizing Blast/Repelling Blast/Eldritch Spear.
      if(cl.id==='warlock' && (state.invocationChoices[cl.id+'__inv']||[]).includes('Pact of the Tome')){
        const pt = state.pactOfTomeChoices;
        const cantripPool = allCantripsAcrossClasses();
        html += `<div class="choice-box" style="margin-top:10px;"><h4>Book of Shadows (Pact of the Tome)</h4>

          <b>Zaubertricks:</b>
          <div class="grid">

            const opts = cantripPool.filter(c=>!taken.includes(c));
            return `<select data-pacttomecantrip="${i}">
              <option value="">--wählen--</option>
              ${opts.map(c=>`<option value="${c}" ${pt.cantrips[i]===c?'selected':''}>${c}</option>`).join('')}
            </select>`;
          }).join('')}
          </div>
          <b style="display:block;margin-top:8px;">Ritual-Zauber (Grad 1):</b>
          <p style="font-size:0.75em;color:var(--muted);">Unsere Datenbank trackt Ritual-Tags nicht separat – hier eine sorgfältig geprüfte Auswahl bekannter Grad-1-Ritual-Zauber (nicht zwingend vollständig).</p>
          <div class="grid">

            </select>`;
          }).join('')}
          </div>
        </div>`;
      }

      // Warlock-only: let the player pick which known damage cantrip each
      // "pick a cantrip" invocation (Agonizing Blast/Repelling Blast/Eldritch Spear) applies to.
      if(cl.id==='warlock'){

          relevantInvocations.forEach(invName=>{

      html += `<label style="font-weight:normal;margin-top:10px;">${catNote.label} (Grad 1-${maxLvl}): <span id="spellcount_${cl.id}">${sel.spells.length}</span> / ${spellCount}</label>
        <p style="font-size:0.78em;color:var(--muted);margin:2px 0 6px;">${catNote.note}</p>
        <p style="font-size:0.78em;color:var(--muted);margin:2px 0 6px;">Die Gesamtzahl gilt über alle Grade hinweg (laut PHB keine Pflicht-Verteilung je Grad – nur Gesamtzahl + maximal erreichbarer Grad). Zur Übersicht trotzdem nach Grad sortiert:</p>
        <div class="checklist">`;
      for(let g=1; g<=maxLvl; g++){
        const gradeList = g===1?pool.level1:(g===2?pool.level2:pool.level3);
        if(!gradeList || !gradeList.length) continue;
        html += `<div style="font-weight:bold;color:var(--accent2);margin:6px 0 2px;">Grad ${g}</div>`;
        alphaSort(gradeList).forEach(s=>{
          const checked = sel.spells.includes(s);
          html += `<label><input type="checkbox" data-spellcheck="${cl.id}|spell|${spellCount}" value="${s}" ${checked?'checked':''}> ${s}</label>`;
        });
      }
      html += `</div>`;
    }
    html += `</div>`;
  });

  html += `<div style="margin-top:16px;">
      <button class="secondary" onclick="goTo(STEP.DECISIONS)">← Zurück</button>
      <button onclick="tryNextFromSpells()">Weiter →</button>
    </div></div>`;
  return html;
}

function tryNextFromSpells(){
  // Soft check: if a "pick a cantrip" invocation was chosen but no eligible cantrip has been
  // assigned to it yet, warn (not block) — the player may still be mid-selection.
  const warlockCl = state.classes.find(c=>c.id==='warlock');
  if(warlockCl){
    const invKey = 'warlock__inv';
    const chosenInvocations = state.invocationChoices[invKey] || [];
    const sel = state.spellSelections.warlock || {cantrips:[]};
    const missing = chosenInvocations.filter(name=>{
      if(!WARLOCK_INVOCATION_CANTRIP_TARGETS[name]) return false;
      const eligible = computeEligibleCantripsForInvocation(name);
      if(!eligible.length) return true; // no eligible cantrip even known yet
      return !((state.invocationCantripChoices||{})[name]);
    });
    if(missing.length){
      const proceed = confirm('Für folgende Invocations wurde noch kein Ziel-Zaubertrick gewählt oder ist noch keiner bekannt: '+missing.join(', ')+'.\n\nTrotzdem fortfahren?');
      if(!proceed) return;
    }
    if(chosenInvocations.includes('Pact of the Tome')){
      const pt = state.pactOfTomeChoices;
      const filled = pt.cantrips.filter(Boolean).length + pt.rituals.filter(Boolean).length;
      if(filled < 5){
        const proceed = confirm('Pact of the Tome (Book of Shadows) ist noch nicht vollständig ausgefüllt ('+filled+'/5: 3 Zaubertricks + 2 Ritual-Zauber).\n\nTrotzdem fortfahren?');
        if(!proceed) return;
      }
    }
  }
  goTo(STEP.EQUIPMENT);
}

function attachSpellHandlers(){
  document.querySelectorAll('[data-spellcheck]').forEach(el=>{
    el.onchange = ()=>{
      const [classId, kind, maxStr] = el.getAttribute('data-spellcheck').split('|');
      const max = parseInt(maxStr);
      const sel = state.spellSelections[classId];
      const arrName = kind==='cantrip' ? 'cantrips' : 'spells';
      if(el.checked){
        if(sel[arrName].length >= max){ el.checked = false; alert('Maximale Anzahl erreicht ('+max+').'); return; }
        sel[arrName].push(el.value);
      } else {
        sel[arrName] = sel[arrName].filter(v=>v!==el.value);
      }
      const counterEl = document.getElementById((kind==='cantrip'?'cantripcount_':'spellcount_')+classId);
      if(counterEl) counterEl.textContent = sel[arrName].length;
      // Warlock cantrips feed the invocation-cantrip-assignment selectors below, whose
      // eligible options depend on which cantrips are currently checked — re-render to refresh them.
      if(classId==='warlock' && kind==='cantrip') render();
    };
  });
  document.querySelectorAll('[data-invocationcantrip]').forEach(el=>{
    el.onchange = ()=>{
      const invName = el.getAttribute('data-invocationcantrip');
      state.invocationCantripChoices = state.invocationCantripChoices || {};
      if(el.value) state.invocationCantripChoices[invName] = el.value;
      else delete state.invocationCantripChoices[invName];
    };
  });
  document.querySelectorAll('[data-pacttomecantrip]').forEach(el=>{
    el.onchange = ()=>{
      const idx = parseInt(el.getAttribute('data-pacttomecantrip'));
      state.pactOfTomeChoices.cantrips[idx] = el.value;
      render();
    };
  });
  document.querySelectorAll('[data-pacttomeritual]').forEach(el=>{
    el.onchange = ()=>{
      const idx = parseInt(el.getAttribute('data-pacttomeritual'));
      state.pactOfTomeChoices.rituals[idx] = el.value;
      render();
    };
  });
}
// ---------- STEP 6: BACKGROUND ----------
const ARTISAN_TOOL_NAMES = ["Alchemist's Supplies","Brewer's Supplies","Calligrapher's Supplies","Carpenter's Tools","Cartographer's Tools","Cobbler's Tools","Cook's Utensils","Glassblower's Tools","Jeweler's Tools","Leatherworker's Tools","Mason's Tools","Painter's Supplies","Potter's Tools","Smith's Tools","Tinker's Tools","Weaver's Tools","Woodcarver's Tools"];
const GAMING_SET_NAMES = ["Dice Set","Playing Card Set"];

function backgroundToolPool(toolText){
  if(toolText.includes('Artisan')) return ARTISAN_TOOL_NAMES;
  if(toolText.includes('Gaming Set')) return GAMING_SET_NAMES;
  if(toolText.includes('Musical Instrument')) return INSTRUMENT_NAMES;
  return null;
}
function resolvedBackgroundTool(bg){
  if(!bg.tool.includes('(Wahl)')) return bg.tool;
  return state.backgroundToolChoice ? `${bg.tool.replace(' (Wahl)','')} (${state.backgroundToolChoice})` : bg.tool;
}

// DMG 2024 "Creating a Background": free choice of 3 abilities, 2 skills, 1 tool, 1 Origin Feat,
// a free name/flavor text, and a fixed 50 GP (no equipment package — the player decides what
// their custom background actually needs).
function renderCustomBackgroundForm(){
  const cb = state.customBackground;
  const priorSkills = new Set();
  if(state.speciesSkillChoice) priorSkills.add(state.speciesSkillChoice);
  Object.values(state.classSkillChoices).forEach(arr=>(arr||[]).forEach(s=>priorSkills.add(s)));

  let html = `<div class="info-box">
    <h4>Name des eigenen Hintergrunds</h4>
    <input type="text" data-custombgname value="${cb.name.replace(/"/g,'&quot;')}" placeholder="z.B. Verbannter Hofschmied" style="width:100%;max-width:400px;">
    <h4 style="margin-top:10px;">Kurzbeschreibung (optional)</h4>
    <textarea data-custombgflavor rows="3" style="width:100%;max-width:500px;" placeholder="Freitext, z.B. gemeinsam mit dem DM erarbeitet...">${cb.flavor}</textarea>
  </div>

  <div class="choice-box"><h4>3 Attribute frei wählen</h4>
    <p style="font-size:0.85em;color:var(--muted);">Nach DMG-2024-Regel: Wähle drei beliebige, unterschiedliche Attribute.</p>
    <div class="grid">
      ${[0,1,2].map(i=>{
        const taken = cb.abilityChoices.filter((_,idx)=>idx!==i);
        const opts = ABILITIES.filter(a=>!taken.includes(a));
        return `<select data-custombgability="${i}">
          <option value="">--Attribut ${i+1}--</option>
          ${opts.map(a=>`<option value="${a}" ${cb.abilityChoices[i]===a?'selected':''}>${ABIL_DE[a]}</option>`).join('')}
        </select>`;
      }).join('')}
    </div>
  </div>`;

  const allThreePicked = cb.abilityChoices.every(Boolean);
  if(allThreePicked){
    const syntheticBg = {abilityScores: cb.abilityChoices};
    html += `<div class="choice-box"><h4>Attributspunkte verteilen</h4>
      <div>
        <button class="small ${state.backgroundAbilityMode==='plus2plus1'?'':'secondary'}" data-bgmode="plus2plus1">+2 / +1 auf zwei Attribute</button>
        <button class="small ${state.backgroundAbilityMode==='plus1all'?'':'secondary'}" data-bgmode="plus1all">+1 auf alle drei Attribute</button>
      </div>
      <div id="bgAbilityPicksArea">${renderBgAbilityPicks(syntheticBg)}</div>
      </div>`;
  }

  html += `<div class="choice-box"><h4>2 Skills frei wählen</h4>
    <div class="grid">
      ${[0,1].map(i=>{
        const otherPick = cb.skillPicks[1-i];
        const opts = alphaSort(SKILLS.filter(s=>!priorSkills.has(s) && s!==otherPick));
        return `<select data-custombgskill="${i}">
          <option value="">--Skill ${i+1}--</option>
          ${opts.map(s=>`<option value="${s}" ${cb.skillPicks[i]===s?'selected':''}>${s}</option>`).join('')}
        </select>`;
      }).join('')}
    </div>
    <p style="font-size:0.78em;color:var(--muted);margin-top:4px;">Skills, die du schon durch Volk/Klasse hast, sind hier nicht mehr wählbar.</p>
  </div>`;

  html += `<div class="choice-box"><h4>1 Werkzeug frei wählen</h4>
    <select data-custombgtool>
      <option value="">--wählen--</option>
      ${alphaSort(allToolNames()).map(t=>`<option value="${t}" ${cb.toolPick===t?'selected':''}>${t}</option>`).join('')}
    </select>
  </div>`;

  const chosenFeatName = cb.featChoiceName || '';
  html += `<div class="choice-box"><h4>1 Origin Feat frei wählen</h4>
    <select data-custombgfeat>
      <option value="">--wählen--</option>
      ${alphaSort(DATA.feats_origin, f=>f.name).map(f=>`<option value="${f.name}" ${chosenFeatName===f.name?'selected':''}>${f.name} (${f.sourceTag||'PHB'})</option>`).join('')}
    </select>`;
  if(chosenFeatName){
    const featDef = DATA.feats_origin.find(f=>f.name===chosenFeatName);
    html += `<div class="info-box">${sourceBadge(featDef)}${featDef.desc}</div>`;

  }
  html += `</div>`;

  html += `<div class="info-box"><b>Ausrüstung:</b> 50 GP (fest, statt einem vorgegebenen Startpaket – du entscheidest im Einkaufs-Schritt selbst, was dein Hintergrund gebraucht hätte).</div>`;

  html += renderExpertiseSection();
  return html;

function buildBackgroundDetailsHtml(){
  if(state.backgroundId==='custom_background'){
    return renderCustomBackgroundForm();
  }
  let details = '';
  const b = getSelectedBackground();
  const priorSkills = new Set();
  if(state.speciesSkillChoice) priorSkills.add(state.speciesSkillChoice);
  Object.values(state.classSkillChoices).forEach(arr=>(arr||[]).forEach(s=>priorSkills.add(s)));
  const overlap = b.skills.filter(s => priorSkills.has(s));
  details = `<div class="info-box">
    <b>${b.name}</b><br>
    ${b.flavor?`<p style="font-style:italic;color:var(--muted);margin:4px 0 8px;">${b.flavor}</p>`:''}
    <b>Skills:</b> ${b.skills.join(', ')}<br>
    <b>Werkzeug:</b> ${resolvedBackgroundTool(b)}<br>
    <b>Feat:</b> ${b.feat}<br>
    <b>Ausrüstung:</b> ${b.equipment}
    </div>`;
  if(overlap.length){
    details += `<p class="warn">Hinweis: ${overlap.join(', ')} hast du bereits durch Volk/Klasse. Der Hintergrund-Skill ist fest vorgegeben und lässt sich nicht tauschen – sprich das ggf. mit deinem DM ab (z.B. Ersatzfertigkeit oder Expertise stattdessen).</p>`;
  }

  // Mist Wanderer / Spirit Medium: PHB text only offers a Dark Gift feat here, which we don't
  // otherwise implement (bound to the Ravenloft campaign). Controlled by the global "andere
  // Welten"-Checkbox at the top of this step: off (default) => normal Origin Feat picker;
  // on => the book's recommended Dark Gift applies automatically, no extra picker needed.
  const rawBg = DATA.backgrounds.find(x=>x.id===state.backgroundId);
  if(rawBg && rawBg.featIsDarkGiftDefault){
    if(state.allowOtherSettingContent){
      details += `<div class="choice-box">
        <h4>Feat: ${rawBg.feat} (Dark Gift)</h4>
        <p style="font-size:0.85em;color:var(--muted);">${rawBg.featDarkGiftDesc}</p>
      </div>`;
    } else {
      const overrideCurrent = state.darkGiftOverrideFeat || '';
      details += `<div class="choice-box">
        <h4>Feat: normaler Origin Feat statt Dark Gift</h4>
        <p style="font-size:0.85em;color:var(--muted);">Die Checkbox oben ("andere Welten") ist aus, daher gilt hier ein normaler Origin Feat statt ${rawBg.feat} (Dark Gift).</p>
        <select data-darkgiftoverridefeat>
          <option value="">--Origin Feat wählen--</option>
          ${alphaSort(DATA.feats_origin, f=>f.name).map(f=>`<option value="${f.name}" ${overrideCurrent===f.name?'selected':''}>${f.name} (${f.sourceTag||'PHB'})</option>`).join('')}
        </select>
      </div>`;
    }
  }

  // Tool proficiency choice, if the background's tool is a category placeholder like "Gaming Set (Wahl)"
  if(b.tool.includes('(Wahl)')){
    const toolPool = backgroundToolPool(b.tool);
    details += `<div class="choice-box"><h4>Werkzeug wählen</h4>
      <select data-bgtool>
        <option value="">--wählen--</option>
        ${alphaSort(toolPool||[]).map(t=>`<option value="${t}" ${state.backgroundToolChoice===t?'selected':''}>${t}</option>`).join('')}
      </select>
      </div>`;
  }

  // Ability score allocation
  details += `<div class="choice-box"><h4>Attributspunkte verteilen</h4>
    <p style="font-size:0.85em;color:var(--muted);">Wähle aus: ${b.abilityScores.join(', ')}</p>
    <div>
      <button class="small ${state.backgroundAbilityMode==='plus2plus1'?'':'secondary'}" data-bgmode="plus2plus1">+2 / +1 auf zwei Attribute</button>
      <button class="small ${state.backgroundAbilityMode==='plus1all'?'':'secondary'}" data-bgmode="plus1all">+1 auf alle drei Attribute</button>
    </div>
    <div id="bgAbilityPicksArea">${renderBgAbilityPicks(b)}</div>
    </div>`;

  // Feat sub-choice if applicable
  const featDef = findFeatDef(b.feat);
  if(featDef && featDef.choice){
    const forcedClass = getBackgroundFeatForcedClass(b);
    state.backgroundFeatSubChoice = state.backgroundFeatSubChoice || {};
    if(forcedClass && !state.backgroundFeatSubChoice.magicClass){
      state.backgroundFeatSubChoice.magicClass = forcedClass;
    }
    details += `<div class="choice-box"><h4>Feat-Unterauswahl: ${b.feat}</h4>
      <p style="font-size:0.85em;color:var(--muted);">${sourceBadge(featDef)}${featDef.desc}</p>
      <div id="bgFeatSubArea">${renderFeatSubChoiceUI(featDef, 'BGFEAT', state.backgroundFeatSubChoice, forcedClass)}</div>
      </div>`;
  }

  // Expertise (Rogue/Bard): needs the full skill list (class + background), so it's placed here
  // once the background's skills are also known.
  details += renderExpertiseSection();
  return details;
}
function renderBackgroundStep(){
  const visibleBackgrounds = DATA.backgrounds.filter(b => !b.settingLocked || state.allowOtherSettingContent);
  let cards = alphaSort(visibleBackgrounds, b=>b.name).map(b=>{
    const isSelected = state.backgroundId===b.id;
    const card = `<div class="card ${isSelected?'selected':''}" data-bg="${b.id}">
      <h3>${b.name}${b.sourceTag?` <span class="badge" title="${b.sourceBook||''}">${b.sourceTag}</span>`:''}</h3>
      <p>Skills: ${b.skills.join(', ')}</p>
      <p style="color:var(--muted);">Attribute: ${b.abilityScores.map(a=>ABIL_DE[a]).join(', ')}</p>
    </div>`;
    // Accordion-style: expand in place right after the selected card (full grid width), instead of
    // appending the details after the entire card list — matches the Species-step pattern.
    const expanded = isSelected ? `<div style="grid-column:1/-1;">${buildBackgroundDetailsHtml()}</div>` : '';
    return card + expanded;
  }).join('');
  const customSelected = state.backgroundId==='custom_background';
  cards += `
    <div class="card ${customSelected?'selected':''}" data-bg="custom_background">
      <h3>Eigener Hintergrund <span class="badge" title="DMG 2024, Creating a Background">Eigen</span></h3>
      <p>Frei wählbar: Name, 3 Attribute, 2 Skills, 1 Werkzeug, 1 Origin Feat</p>
      <p style="color:var(--muted);">Nach DMG-2024-Regeln ("Creating a Background")</p>
    </div>`;
  if(customSelected){
    cards += `<div style="grid-column:1/-1;">${buildBackgroundDetailsHtml()}</div>`;
  }

  return `
  <div class="panel">
    <h2>Schritt 4: Hintergrund (Background)</h2>
    <p style="color:var(--muted);font-size:0.85em;margin-bottom:12px;">${state.allowOtherSettingContent? 'Setting-gebundene Inhalte (Eberron/Ravenloft) sind sichtbar – Einstellung auf Schritt 1 änderbar.' : 'Setting-gebundene Inhalte (Eberron/Ravenloft) sind ausgeblendet – Einstellung auf Schritt 1 änderbar.'}</p>
    <div class="grid">${cards}</div>
    <div style="margin-top:16px;">
      <button class="secondary" onclick="goTo(STEP.SPECIES)">← Zurück</button>
      <button onclick="nextFromBackground()">Weiter →</button>
    </div>
  </div>`;
}

function renderBgAbilityPicks(b){

// ---------- EXPERTISE (Rogue Stufe 1+6, Bard Stufe 2+9) ----------
function collectExpertiseDecisions(){
  const decisions = [];
  state.classes.forEach(cl=>{
    const cdef = classDef(cl.id);
    (cdef.expertise||[]).forEach(e=>{
      if(cl.level >= e.level){
        decisions.push({classId: cl.id, level: e.level, count: e.count, key: cl.id+'__exp__'+e.level});
      }
    });
  });
  return decisions;
}

function renderExpertiseSection(){
  const decisions = collectExpertiseDecisions();
  if(!decisions.length) return '';
  const proficientSkills = computeAllSkills();
  let html = `<div class="choice-box"><h4>Expertise</h4>
    <p style="font-size:0.85em;color:var(--muted);">Expertise verdoppelt deinen Proficiency Bonus für die gewählte Fertigkeit. Wählbar sind nur Fertigkeiten, in denen du bereits Proficiency hast.</p>`;
  decisions.forEach(d=>{
    const cdef = classDef(d.classId);
    const current = state.expertiseChoices[d.key] || [];
    const others = new Set();
    Object.entries(state.expertiseChoices).forEach(([k,arr])=>{ if(k!==d.key) (arr||[]).forEach(s=>others.add(s)); });
    const pool = proficientSkills.filter(s=>!others.has(s));
    html += `<div style="margin-top:8px;"><label style="font-weight:normal;">${cdef.name} Stufe ${d.level} – ${d.count} Fertigkeiten:</label>
      <div id="expertise_${d.key}_container">${renderDedupSelects('expertise_'+d.key, d.count, pool, current)}</div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

function attachExpertiseHandlers(){
  const decisions = collectExpertiseDecisions();
  decisions.forEach(d=>{
    for(let i=0;i<d.count;i++){
      const el = document.getElementById('expertise_'+d.key+'_'+i);
      if(!el) continue;
      el.onchange = ()=>{
        const arr = [];
        for(let j=0;j<d.count;j++){
          const s = document.getElementById('expertise_'+d.key+'_'+j);
          if(s && s.value) arr[j]=s.value;
        }
        state.expertiseChoices[d.key] = arr.filter(Boolean);
        render();
      };
    }
  });
}
function computeExpertiseSkills(){
  const set = new Set();
  Object.values(state.expertiseChoices).forEach(arr=>(arr||[]).forEach(s=>set.add(s)));
  // Knowledge Domain (Cleric): the 2 skills chosen via Blessings of Knowledge get Expertise,
  // not just plain proficiency — this was previously only documented in the notes, not applied.
  if(state.subclassChoices.cleric==='Knowledge Domain'){
    ['cleric__sc__3__0','cleric__sc__3__1'].forEach(k=>{
      const v = state.subclassChoiceOptions[k];
      if(v) set.add(v);
    });
  }
  return set;
}


function attachBackgroundHandlers(){
  document.querySelectorAll('[data-bg]').forEach(el=>{
    el.onclick = ()=>{
      state.backgroundId = el.getAttribute('data-bg');
      state.backgroundAbilityMode = null;
      state.backgroundAbilityPicks = [];

      state.darkGiftOverrideFeat = null;

  const darkGiftFeatSel = document.querySelector('[data-darkgiftoverridefeat]');
  if(darkGiftFeatSel) darkGiftFeatSel.onchange = ()=>{ state.darkGiftOverrideFeat = darkGiftFeatSel.value; state.backgroundFeatSubChoice = null; render(); };
  document.querySelectorAll('[data-bgmode]').forEach(el=>{
    el.onclick = ()=>{
      state.backgroundAbilityMode = el.getAttribute('data-bgmode');
      state.backgroundAbilityPicks = [];
      render();
    };
  });
  const a1 = document.querySelector('[data-bgability1]');
  if(a1) a1.onchange = ()=>{ state.backgroundAbilityPicks[0] = a1.value; render(); };
  const a2 = document.querySelector('[data-bgability2]');
  if(a2) a2.onchange = ()=>{ state.backgroundAbilityPicks[1] = a2.value; render(); };

  // feat sub-choice generic handlers (reuse pattern with BGFEAT prefix)
  const abilitySel = document.querySelector('[data-featsub-ability="BGFEAT"]');
  if(abilitySel) abilitySel.onchange = ()=>{ if(!state.backgroundFeatSubChoice) state.backgroundFeatSubChoice={}; state.backgroundFeatSubChoice.ability = abilitySel.value; };
  const dmgSel = document.querySelector('[data-featsub-dmgtype="BGFEAT"]');
  if(dmgSel) dmgSel.onchange = ()=>{ if(!state.backgroundFeatSubChoice) state.backgroundFeatSubChoice={}; state.backgroundFeatSubChoice.damageType = dmgSel.value; };
  const miSel = document.querySelector('[data-featsub-miclass="BGFEAT"]');
  if(miSel) miSel.onchange = ()=>{ state.backgroundFeatSubChoice = state.backgroundFeatSubChoice||{}; state.backgroundFeatSubChoice.magicClass = miSel.value; state.backgroundFeatSubChoice.cantrips=[]; state.backgroundFeatSubChoice.level1=[]; render(); };
  const schoolSel = document.querySelector('[data-featsub-schoolspell="BGFEAT"]');

  document.querySelectorAll('select[id^="BGFEAT_"]').forEach(el=>{
    el.onchange = ()=>{

      const m = id.match(/^BGFEAT_(st|tool|instr|wpn|micantrip|mil1|ritual)_(\d+)$/);

      const kind = m[1];
      let arrName = {st:'picks', tool:'picks', instr:'picks', wpn:'picks', micantrip:'cantrips', mil1:'level1', ritual:'ritualSpells'}[kind];
      const count = document.querySelectorAll(`select[id^="BGFEAT_${kind}_"]`).length;
      const arr = [];
      for(let i=0;i<count;i++){
        const s = document.getElementById('BGFEAT_'+kind+'_'+i);
        if(s && s.value) arr[i]=s.value;
      }
      state.backgroundFeatSubChoice = state.backgroundFeatSubChoice || {};
      state.backgroundFeatSubChoice[arrName] = arr.filter(Boolean);
      render();
    };
  });

  // ---- Custom Background ("Eigener Hintergrund") handlers ----
  const cb = state.customBackground;
  const nameEl = document.querySelector('[data-custombgname]');
  if(nameEl) nameEl.oninput = ()=>{ cb.name = nameEl.value; };
  const flavorEl = document.querySelector('[data-custombgflavor]');
  if(flavorEl) flavorEl.oninput = ()=>{ cb.flavor = flavorEl.value; };
  document.querySelectorAll('[data-custombgability]').forEach(el=>{
    el.onchange = ()=>{
      const idx = parseInt(el.getAttribute('data-custombgability'));
      cb.abilityChoices[idx] = el.value;
      state.backgroundAbilityMode = null;
      state.backgroundAbilityPicks = [];
      render();
    };
  });
  document.querySelectorAll('[data-custombgskill]').forEach(el=>{
    el.onchange = ()=>{
      const idx = parseInt(el.getAttribute('data-custombgskill'));
      cb.skillPicks[idx] = el.value;
      render();
    };
  });
  const toolPickEl = document.querySelector('[data-custombgtool]');
  if(toolPickEl) toolPickEl.onchange = ()=>{ cb.toolPick = toolPickEl.value; render(); };
  const featPickEl = document.querySelector('[data-custombgfeat]');
  if(featPickEl) featPickEl.onchange = ()=>{ cb.featChoiceName = featPickEl.value; state.backgroundFeatSubChoice = {}; render(); };

  attachExpertiseHandlers();
}

function nextFromBackground(){
  if(!state.backgroundId){ alert('Bitte einen Hintergrund wählen.'); return; }
  const rawBgForValidation = DATA.backgrounds.find(x=>x.id===state.backgroundId);
  if(rawBgForValidation && rawBgForValidation.featIsDarkGiftDefault && !state.allowOtherSettingContent && !state.darkGiftOverrideFeat){ alert('Bitte einen Origin Feat als Ersatz für den Dark Gift wählen.'); return; }
  if(state.backgroundId==='custom_background'){
    const cb = state.customBackground;
    if(!cb.name.trim()){ alert('Bitte einen Namen für deinen eigenen Hintergrund eintragen.'); return; }
    if(!cb.abilityChoices.every(Boolean)){ alert('Bitte alle drei Attribute für deinen eigenen Hintergrund wählen.'); return; }
    if(!cb.skillPicks.every(Boolean)){ alert('Bitte beide Skills für deinen eigenen Hintergrund wählen.'); return; }
    if(!cb.toolPick){ alert('Bitte ein Werkzeug für deinen eigenen Hintergrund wählen.'); return; }
    if(!cb.featChoiceName){ alert('Bitte einen Origin Feat für deinen eigenen Hintergrund wählen.'); return; }
  }
  if(!state.backgroundAbilityMode){ alert('Bitte Attributspunkte-Verteilung wählen.'); return; }
  if(state.backgroundAbilityMode==='plus2plus1' && (!state.backgroundAbilityPicks[0] || !state.backgroundAbilityPicks[1])){ alert('Bitte beide Attribute (für +2 und +1) wählen.'); return; }
  const bg = getSelectedBackground();
  if(bg.tool.includes('(Wahl)') && !state.backgroundToolChoice){ alert('Bitte ein konkretes Werkzeug wählen.'); return; }
  const expDecisions = collectExpertiseDecisions();
  for(const d of expDecisions){
    const picked = state.expertiseChoices[d.key] || [];
    if(picked.length < d.count){ alert('Bitte für '+classDef(d.classId).name+' Stufe '+d.level+' alle '+d.count+' Expertise-Fertigkeiten wählen.'); return; }
  }
  goTo(STEP.CLASSES);
}

function totalAvailableGold(){

  if(state.classEquipChoice==='gold'){ const eq=classDef(firstClassId()).startingEquipment; total += (eq&&eq.goldB)||0; }
  if(state.backgroundEquipChoice==='gold'){ total += 50; }
  return total;
}
function cartTotal(){
  return state.shoppingCart.reduce((s,i)=> s + i.cost_gp*i.qty, 0);
}

function renderShoppingStep(){
  const budget = totalAvailableGold();
  const spent = cartTotal();
  const remaining = (budget - spent).toFixed(2);

  const cats = [
    {key:'weapons', label:'Waffen', pageNote: DATA.note_weapons_pageref, items:[...DATA.weapons_simple_melee, ...DATA.weapons_simple_ranged, ...DATA.weapons_martial_melee_examples, ...DATA.weapons_martial_ranged_examples].map(w=>({name: w.mastery ? `${w.name} — Mastery: ${w.mastery}` : w.name, cost:w.cost, baseName: w.name}))},
    {key:'armor', label:'Rüstung', pageNote: DATA.note_armor_pageref, items: DATA.armor.map(a=>({name:a.name+' ('+a.type+')', cost:a.cost}))},
    {key:'gear', label:'Ausrüstung/Gear', pageNote: DATA.note_gear_pageref, items: DATA.gear},

    <div class="tabs">${cats.map((c)=>`<div class="tab-btn ${c.key===state.shoppingActiveTab?'active':''}" data-tab="${c.key}">${c.label}</div>`).join('')}</div>`;

  cats.forEach((c)=>{
    html += `<div class="tab-content" id="tab_${c.key}" style="${c.key===state.shoppingActiveTab?'':'display:none;'}">

      <table><thead><tr><th>Name</th><th>Kosten</th><th>Anzahl im Warenkorb</th><th></th></tr></thead><tbody>`;

        <td><button class="small" data-addtocart="${encodeURIComponent(item.name)}|${encodeURIComponent(item.cost)}">+</button>
        ${qty>0?`<button class="small secondary" data-removefromcart="${encodeURIComponent(item.name)}">-</button>`:''}</td></tr>`;

  html += `<div style="margin-top:16px;">
