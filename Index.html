": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, {"type": "ritualCaster", "pool": ["Alarm", "Comprehend Languages", "Detect Magic", "Detect Poison and Disease", "Find Familiar", "Identify", "Illusory Script", "Purify Food and Drink", "Speak with Animals", "Unseen Servant"], "label": "Grad-1-Ritual-Zauber (Anzahl = aktueller Proficiency Bonus)"}], "pageRef": 206}, {"name": "Sentinel", "desc": "Opportunity Attacks stoppen Bewegung des Ziels.", "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "choice": {"type": "ability", "count": 1, "options": ["Strength", "Dexterity"], "label": "Attribut +1 (STR/DEX)"}, "pageRef": 207}, {"name": "Sharpshooter", "desc": "Bypass Cover: Fernkampfangriffe ignorieren Half/Three-Quarters Cover. Firing in Melee: kein Disadvantage binnen 5ft eines Gegners mit Fernkampfwaffen. Long Shots: kein Disadvantage bei langer Reichweite.", "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "choice": {"type": "ability", "count": 1, "options": ["Dexterity"], "label": "Attribut +1 (DEX)"}, "pageRef": 207, "prereq": "Stufe 4+, Dexterity 13+"}, {"name": "Shield Master", "desc": "Shield Bash: bei Nahkampftreffer als Teil der Attack Action zusätzlich Schild-Stoß (STR-Save DC 8+STR-Mod+Proficiency) – bei Fehlschlag Ziel 5ft wegstoßen ODER Prone (1x/Zug). Interpose Shield: bei DEX-Save für halben Schaden als Reaction bei erfolgreichem Save stattdessen KEINEN Schaden nehmen (Schild muss getragen werden).", "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "choice": {"type": "ability", "count": 1, "options": ["Strength"], "label": "Attribut +1 (STR)"}, "pageRef": 207}, {"name": "Skulker", "desc": "Kann sich bei leichtem Verfehlen mit Fernkampf weiter verstecken; kein Enttarnen durch schlechtes Licht.", "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "choice": {"type": "ability", "count": 1, "options": ["Dexterity"], "label": "Attribut +1 (DEX)"}, "pageRef": 208}, {"name": "Speedy", "desc": "+10ft Speed.", "choice": {"type": "ability", "count": 1, "options": ["Dexterity", "Constitution"], "label": "Attribut +1 (DEX/CON)"}, "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "pageRef": 208}, {"name": "Spell Sniper", "desc": "Verdoppelt Reichweite von Angriffszaubern, ignoriert Halb-/Dreiviertel-Deckung.", "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "pageRef": 208}, {"name": "War Caster", "desc": "Advantage bei Concentration-Saves; kann somatische Komponenten mit besetzten Händen ausführen.", "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "pageRef": 209}, {"name": "Weapon Master", "desc": "Mastery Property: Zugriff auf die Mastery-Eigenschaft EINES Waffentyps (Simple oder Martial) deiner Wahl, mit dem du Proficiency hast. Nach jeder Long Rest änderbar.", "choice": [{"type": "ability", "count": 1, "options": ["Strength", "Dexterity"], "label": "Attribut +1 (STR/DEX)"}, {"type": "weapon", "count": 1, "label": "Wähle 1 Waffentyp für Mastery-Eigenschaft (bei Long Rest änderbar)"}], "sourceTag": "PHB", "sourceBook": "Player's Handbook 2024", "pageRef": 209}, {"name": "Cold Caster", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+. Kennst Ray of Frost (oder tauschst einen bekannten Wizard-Cantrip). Frostbite: 1x/Zug bei Cold-Schaden-Treffer zieht das Ziel 1d4 vom nächsten Save vor Ende deines nächsten Zuges ab.", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA, auch Zauberfertigkeit für Ray of Frost)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 39, "autoGrantedSpells": [{"level": 4, "spells": ["Ray of Frost"], "note": "Bekannter Cantrip (oder getauschter Wizard-Cantrip)."}]}, {"name": "Dragonscarred", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Cult of the Dragon Initiate. Damage Resistance (Acid/Cold/Fire/Lightning/Poison nach Wahl). Fearsome Power: bei Schaden durch Attack/Magic Action kannst du Dragon's Terror als Bonus Action nutzen.", "choice": {"type": "ability", "count": 1, "options": ["Constitution", "Charisma"], "label": "Attribut +1 (CON/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 39}, {"name": "Enclave Magic", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Emerald Enclave Fledgling. Friend to Animals: Advantage bei Influence-Checks mit Beasts. Two Hearts, One Mind: immer Beast Sense vorbereitet, 1x ohne Slot castbar (regeneriert bei Long Rest, dann ohne Concentration nutzbar), auch mit normalen Slots castbar.", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 39}, {"name": "Fairy Trickster", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+. Faerie Trod Trotter: bei Disengage kostet Difficult Terrain diese Runde keine zusätzliche Bewegung. Flustering Strike: bei Treffer WIS-Save DC 8+Mod+PB oder Disadvantage auf Saves bis Ende deines nächsten Zuges (PB-mal/Tag, regeneriert bei Long Rest).", "choice": {"type": "ability", "count": 1, "options": ["Dexterity", "Charisma"], "label": "Attribut +1 (DEX/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 39}, {"name": "Genie Magic", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+. Wish Magic: Magic Action, castest 1x kostenlos einen Grad-1-Zauber (Action-Castingzeit) aus der Sorcerer-Liste (regeneriert bei Long Rest). Ab Stufe 11 als Grad-2-Slot, ab Stufe 17 als Grad-3-Slot gewirkt.", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 39}, {"name": "Harper Teamwork", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Harper Agent. Withering Wordplay: bei Help-Action zur Angriffs-Unterstützung hat der Gegner zusätzlich Disadvantage auf seinen ersten Save bis zu deinem nächsten Zug. Inspiring Willpower: beendest du per Save Frightened/Paralyzed bei dir selbst, kann ein Verbündeter binnen 30ft mit derselben Condition sie ebenfalls sofort beenden.", "choice": {"type": "ability", "count": 1, "options": ["Dexterity", "Charisma"], "label": "Attribut +1 (DEX/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 39}, {"name": "Lordly Resolve", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Lords' Alliance Agent. Standard Bearer: Bonus Action, bis zu 3 Kreaturen binnen 60ft können sofort Prone beenden + werden 1 Min. gegen neues Charmed/Frightened gestärkt bzw. erhalten Advantage auf ihren nächsten Save dagegen (1x/Long Rest).", "choice": {"type": "ability", "count": 1, "options": ["Strength", "Charisma"], "label": "Attribut +1 (STR/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 40}, {"name": "Mythal Touched", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+. Mythal Ward: Reaction bei Zauberangriff-Treffer/Save-Fehlschlag gegen dich: würfle 1W20 auf die Mythal-Touched-Magic-Tabelle für einen Zufallseffekt (DC 8+Mod+PB falls Save nötig). PB-mal/Tag, regeneriert bei Long Rest.", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 40}, {"name": "Order's Resilience", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Tyro of the Gauntlet. Resurge: bei Prone kannst du dich mit nur 5ft Bewegung aufrichten. Stronger Together: binnen 5ft eines nicht-incapacitated Verbündeten habt ihr beide Advantage auf STR-Saves (nicht nutzbar falls du selbst Incapacitated bist).", "choice": {"type": "ability", "count": 1, "options": ["Strength", "Wisdom", "Charisma"], "label": "Attribut +1 (STR/WIS/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 40}, {"name": "Purple Dragon Commandant", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Purple Dragon Rook oder Martial-Weapon-Proficiency. Encourage Ally: Bonus Action, Verbündeter binnen 30ft erhält Temp-HP = 2d6+Mod (PB-mal/Tag, regeneriert bei Long Rest). Last Stand: Advantage auf Angriffswürfe während du Bloodied bist.", "choice": {"type": "ability", "count": 1, "options": ["Strength", "Dexterity"], "label": "Attribut +1 (STR/DEX)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 40}, {"name": "Spellfire Adept", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Spellfire Spark oder Spellcasting/Pact-Magic-Feature. Fueled Spellfire: 1x/Zug bei Radiant-Schadenszauber kannst du bis zu 2 Hit Point Dice würfeln und zum Schaden addieren. Searing Spellfire: dein Radiant-Schaden ignoriert Resistance.", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 41}, {"name": "Street Justice", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+. Headlock: Verbündete haben Advantage gegen von dir Grappled Kreaturen. Sturdy Knot: bei Fesseln mit Chain/Manacles/Rope erhöht sich die Flucht-DC um deinen PB. Tough Talk: Hostile-Attitude gibt keine Disadvantage auf deine Intimidation-Checks.", "choice": {"type": "ability", "count": 1, "options": ["Strength", "Dexterity"], "label": "Attribut +1 (STR/DEX)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 41}, {"name": "Zhentarim Tactics", "sourceTag": "HoF", "desc": "Voraussetzung: Stufe 4+, Feat Zhentarim Ruffian. Retaliate: sofort nach Nahkampftreffer gegen dich durch eine Kreatur binnen 5ft kannst du eine Opportunity Attack gegen sie ausführen. Versatile Merc: bei Long Rest wählst du eine proficiente Fertigkeit, in der du bis zum nächsten Long Rest Expertise hast.", "choice": {"type": "ability", "count": 1, "options": ["Dexterity", "Charisma"], "label": "Attribut +1 (DEX/CHA)"}, "sourceBook": "Heroes of Faerûn", "pageRef": 41}, {"name": "Fey-Touched", "desc": "Wähle einen Grad-1-Zauber aus Divination oder Enchantment. Dieser sowie Misty Step sind immer vorbereitet, je 1x/Tag ohne Slot wirkbar (danach nur noch mit Slot), Spellcasting-Attribut = das durch dieses Feat erhöhte Attribut.", "choice": [{"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, {"type": "spellFromSchools", "schools": ["Divination", "Enchantment"], "label": "Wähle einen Grad-1-Zauber aus Divination oder Enchantment"}], "pageRef": 203, "autoGrantedSpells": [{"level": 1, "spells": ["Misty Step"], "note": "Immer vorbereitet, 1x/Tag ohne Slot (danach nur mit echtem Spell Slot)."}]}, {"name": "Durable", "desc": "Advantage auf Death Saving Throws. Bonus Action: 1 Hit Die ausgeben und würfeln, um so viele HP zurückzuerhalten.", "choice": {"type": "ability", "count": 1, "options": ["Constitution"], "label": "Attribut +1 (CON)"}, "pageRef": 203}, {"name": "Mounted Combatant", "desc": "Advantage auf Angriffe gegen unberittene Kreaturen kleiner als dein Reittier binnen 5ft. Reittier nimmt bei erfolgreichem DEX-Save nur die Hälfte/keinen Schaden (wie du). Kannst Angriffe gegen dein Reittier auf dich umlenken.", "choice": {"type": "ability", "count": 1, "options": ["Strength", "Dexterity", "Wisdom"], "label": "Attribut +1 (STR/DEX/WIS)"}, "pageRef": 205}, {"name": "Shadow-Touched", "desc": "Wähle einen Grad-1-Zauber aus Illusion oder Necromancy. Dieser sowie Invisibility sind immer vorbereitet, je 1x/Tag ohne Slot wirkbar (danach nur noch mit Slot), Spellcasting-Attribut = das durch dieses Feat erhöhte Attribut.", "choice": [{"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, {"type": "spellFromSchools", "schools": ["Illusion", "Necromancy"], "label": "Wähle einen Grad-1-Zauber aus Illusion oder Necromancy"}], "pageRef": 207, "autoGrantedSpells": [{"level": 1, "spells": ["Invisibility"], "note": "Immer vorbereitet, 1x/Tag ohne Slot (danach nur mit echtem Spell Slot)."}]}, {"name": "Telekinetic", "desc": "Lernst Mage Hand (ohne V/S-Komponenten, unsichtbare Hand möglich, +30ft Reichweite). Bonus Action: telekinetischer Stoß gegen eine Kreatur binnen 30ft (STR-Save DC 8+Attributsmod+Proficiency, sonst 5ft verschoben).", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "pageRef": 208, "autoGrantedSpells": [{"level": 1, "spells": ["Mage Hand"], "note": "Minor Telekinesis: bekannter Cantrip, ohne V/S-Komponenten, unsichtbare Hand möglich, +30ft Reichweite."}]}, {"name": "Telepathic", "desc": "Telepathische Kommunikation mit jeder gesehenen Kreatur binnen 60ft (in einer dir bekannten Sprache). Detect Thoughts immer vorbereitet, 1x/Tag ohne Slot wirkbar.", "choice": {"type": "ability", "count": 1, "options": ["Intelligence", "Wisdom", "Charisma"], "label": "Attribut +1 (INT/WIS/CHA)"}, "pageRef": 209, "autoGrantedSpells": [{"level": 1, "spells": ["Detect Thoughts"], "note": "Immer vorbereitet, 1x/Tag ohne Slot wirkbar."}]}, {"name": "Aberrant Dragonmark", "pageRef": 47, "desc": "Aberrant Fortitude: Reaction bei fehlgeschlagenem CON-Save, +1d4 auf den Save, 1x/Long Rest. Aberrant Magic: 1 Sorcerer-Zaubertrick + 1 Sorcerer-Grad-1-Zauber immer vorbereitet, 1x/Long Rest ohne Slot wirkbar (danach mit Slot), CON als Zauberfertigkeit. Aberrant Surge: beim Wirken des Grad-1-Zaubers 1 Hit Die ausgeben+würfeln – gerade Zahl: Temp-HP; ungerade: 30ft-Kreatur nimmt Force-Schaden (sonst man selbst).", "sourceTag": "EFA", "sourceBook": "Eberron: Forge of the Artificer", "settingLocked": "Eberron", "category": "Dragonmark", "choice": {"type": "magicInitiate", "classes": ["sorcerer"], "cantripCount": 1, "level1Count": 1}}, {"name": "Mark of Detection", "pageRef": 47, "desc": "Deductive Intuition: +1d4 auf INT(Investigation)/WIS(Insight)-Che oni werden automatisch berechnet, sofern deine Klassenstufe sie freischaltet. Bedingungen (z.B. 'ohne Heavy Armor') werden als Hinweistext angezeigt, aber nicht automatisch anhand deiner Ausrüstung geprüft.", "note_expertise": "Expertise verdoppelt den Proficiency Bonus für gewählte Fertigkeiten, in denen bereits Proficiency besteht (Rogue: Stufe 1 und 6; Bard: Stufe 2 und 9 – Bard-Stufe-9-Wert ist ein Richtwert, bitte mit PHB gegenprüfen).", "note_weapon_mastery": "Weapon-Mastery-Anzahl ist der Basiswert auf Stufe 1; er steigt auf höheren Stufen laut Klassentabelle (z.B. Barbarian/Fighter). Diese App zeigt aktuell nur den Basiswert; bei hohen Stufen bitte im PHB gegenprüfen, ob weitere Waffentypen wählbar sind.", "subChoiceDetails": {"elf": {"Drow": {"extra": "Darkvision erhöht sich auf 120 ft. Du kennst zusätzlich den Zaubertrick Dancing Lights.", "level3": "Faerie Fire", "level5": "Darkness"}, "High Elf": {"extra": "Du kennst den Zaubertrick Prestidigitation (nach jeder Long Rest gegen einen beliebigen Wizard-Zaubertrick tauschbar).", "level3": "Detect Magic", "level5": "Misty Step"}, "Wood Elf": {"extra": "Speed erhöht sich auf 35 ft. Du kennst zusätzlich den Zaubertrick Druidcraft.", "level3": "Longstrider", "level5": "Pass without Trace", "speedBonus": 5}}, "gnome": {"Forest Gnome": {"extra": "Du kennst den Zaubertrick Minor Illusion. Zusätzlich hast du immer Speak with Animals vorbereitet, castbar ohne Slot Proficiency-Bonus-mal pro Tag."}, "Rock Gnome": {"extra": "Du kennst die Zaubertricks Mending und Prestidigitation. Zusätzlich kannst du mit 10 Minuten Prestidigitation ein kleines mechanisches Spielzeug (Tiny Clockwork Device) erschaffen."}}, "tiefling": {"Abyssal": {"resistance": "Poison", "cantrip": "Poison Spray", "level3": "Ray of Sickness", "level5": "Hold Person"}, "Chthonic": {"resistance": "Necrotic", "cantrip": "Chill Touch", "level3": "False Life", "level5": "Ray of Enfeeblement"}, "Infernal": {"resistance": "Fire", "cantrip": "Fire Bolt", "level3": "Hellish Rebuke", "level5": "Darkness"}}, "Beasthide": "+1d6 zusätzliche Temp-HP beim Shiften. Solange geshiftet: +1 AC.", "Longtooth": "Beim Shiften und danach je als Bonus Action: Unarmed Strike mit Fangzähnen, 1d6+STR-Mod Piercing-Schaden statt normalem Unarmed-Schaden.", "Swiftstride": "Solange geshiftet: +10ft Speed. Zusätzlich als Reaction bis 10ft bewegen, wenn eine Kreatur binnen 5ft ihren Zug beendet (löst keine Opportunity Attack aus).", "Wildhunt": "Solange geshiftet: Advantage auf WIS-Checks. Keine Kreatur binnen 30ft kann Advantage auf Angriffe gegen dich haben, außer du bist Incapacitated."}, "battleMasterManeuvers": [{"name": "Ambush", "desc": "Bei DEX(Stealth)-Check oder Initiative-Wurf: 1 Superiority Die ausgeben und addieren (nicht falls Incapacitated).", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Bait and Switch", "desc": "Binnen 5ft einer Kreatur auf deinem Zug: 1 Superiority Die ausgeben, Platz tauschen (mind. 5ft Bewegung, Kreatur willig, nicht Incapacitated, keine Opportunity Attack). Würfle die Die: du oder die Kreatur erhält AC-Bonus in Höhe des Wurfs bis zu deinem nächsten Zug.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Commander's Strike", "desc": "Bei Attack Action: 1 Angriff gegen Kommando an einen willigen, sicht-/hörbaren Verbündeten tauschen (1 Superiority Die ausgeben). Verbündeter macht sofort per Reaction 1 Waffen-/Unarmed-Angriff, Superiority Die auf den Schaden bei Treffer.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Commanding Presence", "desc": "Bei CHA(Intimidation/Performance/Persuasion)-Check: 1 Superiority Die ausgeben und addieren.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Disarming Attack", "desc": "Bei Treffer: 1 Superiority Die ausgeben (addiert zum Schaden). Ziel macht STR-Save oder lässt 1 gehaltenes Objekt fallen.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Distracting Strike", "desc": "Bei Treffer: 1 Superiority Die ausgeben (addiert zum Schaden). Nächster Angriff eines anderen Angreifers gegen das Ziel hat Advantage (bis zu deinem nächsten Zug).", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Evasive Footwork", "desc": "Bonus Action: 1 Superiority Die ausgeben, Disengage-Action nehmen. Würfle die Die, addiere auf deine AC bis zu deinem nächsten Zug.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Feinting Attack", "desc": "Bonus Action: 1 Superiority Die ausgeben, Ziel binnen 5ft wählen. Advantage auf deinen nächsten Angriff gegen das Ziel diesen Zug; bei Treffer Superiority Die zum Schaden.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Goading Attack", "desc": "Bei Treffer: 1 Superiority Die ausgeben (addiert zum Schaden). Ziel macht WIS-Save oder hat Disadvantage auf Angriffe gegen andere als dich (bis Ende deines nächsten Zuges).", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Lunging Attack", "desc": "Bonus Action: 1 Superiority Die ausgeben, Dash-Action nehmen. Bei mind. 5ft geradliniger Bewegung vor einem Nahkampftreffer als Teil der Attack Action: Superiority Die zum Schaden.", "pageRef": 94, "sourceTag": "PHB"}, {"name": "Maneuvering Attack", "desc": "Bei Treffer: 1 Superiority Die ausgeben (addiert zum Schaden). Williger, sicht-/hörbarer Verbündeter kann per Reaction bis zur Hälfte seiner Speed ohne Opportunity Attack (vom Ziel) bewegen.", "pageRef": 95, "sourceTag": "PHB"}, {"name": "Menacing Attack", "desc": "Bei Treffer: 1 Superiority Die ausgeben (addiert zum Schaden). Ziel macht WIS-Save oder ist Frightened bis Ende deines nächsten Zuges.", "pageRef": 95, "sourceTag": "PHB"}, {"name": "Parry", "desc": "Reaction bei Nahkampf-Schaden gegen dich: 1 Superiority Die ausgeben, Schaden um (Würfel+STR/DEX-Mod nach Wahl) reduzieren.", "pageRef": 95, "sourceTag": "PHB"}, {"name": "Precision Attack", "desc": "Bei Fehlschlag: 1 Superiority Die ausgeben, würfeln und zum Angriffswurf addieren (kann Fehlschlag in Treffer verwandeln).", "pageRef": 95, "sourceTag": "PHB"}, {"name": "Pushing Attack", "desc": "Bei Treffer (Waffe/Unarmed): 1 Superiority <script>
// ===== THEME =====
document.getElementById('themeSwitch').addEventListener('change', function(){
  document.body.setAttribute('data-theme', this.checked ? 'light' : 'dark');
});

// ===== STATE =====
const STEPS = ["Level","Attribute","Volk","Hintergrund","Klassen","Trefferpunkte","Entscheidungen","Zauber","Ausrüstung","Einkaufen","Zusammenfassung"];
const STEP = {LEVEL:0, ABILITIES:1, SPECIES:2, BACKGROUND:3, CLASSES:4, HP:5, DECISIONS:6, SPELLS:7, EQUIPMENT:8, SHOPPING:9, SUMMARY:10};
const ABILITIES = ["Strength","Dexterity","Constitution","Intelligence","Wisdom","Charisma"];
const ABIL_DE = {Strength:"Stärke",Dexterity:"Geschicklichkeit",Constitution:"Konstitution",Intelligence:"Intelligenz",Wisdom:"Weisheit",Charisma:"Charisma"};
const FULL_CASTERS = ['bard','cleric','druid','sorcerer','wizard'];
const HALF_CASTERS = ['paladin','ranger'];
const ASI_LEVELS = {
  default: [4,8,12,16,19],
  fighter: [4,6,8,12,14,16,19],
  rogue: [4,8,10,12,16,19]
};
const FIXED_HP_BY_HITDIE = {6:4, 8:5, 10:6, 12:7}; // + Con modifier, per PHB "Fixed Hit Points by Class" table

let state = {
  step: 0,
  level: 1,
  charName: "",
  extraGold: 0,
  abilityMethod: null,
  abilityScores: {Strength:10,Dexterity:10,Constitution:10,Intelligence:10,Wisdom:10,Charisma:10},
  rolledValues: [null,null,null,null,null,null],
  rolledAssignment: {}, // ability -> index into rolledValues
  standardAssignment: {}, // ability -> value
  speciesId: null,
  speciesSubChoice: null, // e.g. Elven Lineage / Draconic Ancestry / Fiendish Legacy / Giant Ancestry
  speciesSkillChoice: null, // Human "Skillful" / Lupin "Werewolf Instincts" / Reborn "Knowledge from a Past Life"
  speciesAbilityChoice: null, // Hexblood "Hex Magic" spellcasting ability
  speciesDamageTypeChoice: null, // Reborn "Strange Endurance"
  speciesSizeChoice: null, // Medium|Small, for species with a size choice (Aasimar, Human, Tiefling, Dhampir, Hexblood, Lupin, Reborn)
  speciesExtraFeat: null, // Human "Versatile" -> {name, sub:{}}
  classes: [], // [{id, level}]
  classSkillChoices: {}, // classId -> [skill,...]
  expertiseChoices: {}, // key (classId__exp__level) -> [skill,...]
  hpMode: null, // 'average' | 'manual'
  hpRolls: {}, // classId -> [roll per level beyond the very first character level]
  levelUpChoices: {}, // classId -> { level -> {type:'asi'/'feat', ...} }
  fightingStyleChoices: {}, // classId_level -> styleName
  weaponMasteryChoices: {}, // key (classId__wm) -> [weaponName,...]
  maneuverChoices: {}, // key (classId__man__level) -> [maneuverName,...]
  invocationChoices: {}, // key (classId__inv) -> [invocationName,...]
  invocationCantripChoices: {}, // invocationName -> cantripName (Agonizing Blast/Repelling Blast/Eldritch Spear)
  pactOfTomeChoices: {cantrips: ['','',''], rituals: ['','']}, // Book of Shadows: 3 cantrips + 2 ritual level-1 spells from any class list
  warlockLessonsFeat: null, // Warlock Eldritch Invocation "Lessons of the First Ones" -> {name, sub:{}}
  metamagicChoices: {}, // key (classId__meta) -> [metamagicName,...]
  subclassChoiceOptions: {}, // key (classId__sc__level__idx) -> chosen option string
  loreBonusSkills: {}, // key (classId__loreskills) -> [skill,...]
  loreMagicalDiscoveries: {}, // key (classId__loremagic) -> [spell,...]
  savantChoices: {}, // key (classId__savant) -> [spell,...]
  subclassChoices: {}, // classId -> subclassName
  spellSelections: {}, // classId -> {cantrips:[], spells:[]}
  backgroundId: null,
  backgroundAbilityMode: null, // 'plus2' or 'plus1plus1'
  backgroundAbilityPicks: [], // array of ability names
  backgroundFeatSubChoice: null,
  backgroundToolChoice: null, // resolves "(Wahl)" tool proficiencies like "Gaming Set (Wahl)"
  divineOrderChoice: null, // 'Protector' | 'Thaumaturge' (Cleric level 1)
  divineOrderThaumaturgeCantrip: null,
  primalOrderChoice: null, // 'Magician' | 'Warden' (Druid level 1)
  primalKnowledgeSkill: null, // Barbarian level 3
  knowledgeDomainToolChoice: null, // Cleric Knowledge Domain level 3
  elementalAffinityChoice: null, // Draconic Sorcery level 6
  moonPrimalLoreCantrip: null, // College of the Moon (Bard) level 3
  customBackground: {
    name: '',
    abilityChoices: ['', '', ''], // 3 freely picked abilities (DMG "Creating a Background")
    skillPicks: ['', ''],
    toolPick: '',
    featChoiceName: '', // sub-choices reuse state.backgroundFeatSubChoice, same as normal backgrounds
    flavor: ''
  },
  allowOtherSettingContent: false, // global: "Mein DM erlaubt Inhalte, die Ravenloft/Eberron als Welten-Grundkonzept voraussetzen"
  darkGiftOverrideFeat: null, // Mist Wanderer/Spirit Medium: normaler Origin Feat statt Dark Gift, wenn allowOtherSettingContent=false
  classEquipChoice: null, // 'package' | 'gold'
  backgroundEquipChoice: null, // 'package' | 'gold'
  shoppingCart: [], // {name, cost_gp, qty}
  shoppingActiveTab: 'weapons',
  maxStepReached: 0, // tracks the furthest step ever reached, so jumping back doesn't hide later completed steps
  goldSpent: 0
};

// Returns the currently selected background, either from the built-in database (34 backgrounds)
// or a synthetic object built from the freely-chosen "Eigener Hintergrund" fields (DMG 2024
// "Creating a Background" rules), matching the same {id,name,abilityScores,skills,tool,feat,
// equipment,flavor} shape so all existing downstream code keeps working unchanged.
function getSelectedBackground(){
  if(state.backgroundId==='custom_background'){
    const cb = state.customBackground;
    return {
      id: 'custom_background',
      name: cb.name || 'Eigener Hintergrund',
      abilityScores: cb.abilityChoices.filter(Boolean),
      skills: cb.skillPicks.filter(Boolean),
      tool: cb.toolPick || '(noch nicht gewählt)',
      feat: cb.featChoiceName || '(noch nicht gewählt)',
      equipment: '50 GP (eigener Hintergrund: freie Ausrüstungswahl statt festem Startpaket)',
      flavor: cb.flavor || '',
      sourceTag: 'Eigen',
      custom: true
    };
  }
  const bg = DATA.backgrounds.find(b=>b.id===state.backgroundId);
  // Mist Wanderer / Spirit Medium: their PHB-style feat is a Dark Gift by default (needs DM
  // approval, see UI note). If the global "andere Welten" checkbox is off, a normal Origin Feat
  // is used instead — reflected here so every downstream calculation picks it up. Falls back to
  // a clear placeholder (never the Dark Gift name) until that replacement feat is actually chosen.
  if(bg && bg.featIsDarkGiftDefault && !state.allowOtherSettingContent){
    return {...bg, feat: state.darkGiftOverrideFeat || '(noch nicht gewählt)'};
  }
  return bg;
}

function alphaSort(arr, keyFn){
  keyFn = keyFn || (x=>x);
  return [...arr].sort((a,b)=>keyFn(a).localeCompare(keyFn(b)));
}
function sourceBadge(obj){
  return obj && obj.sourceTag ? ` <span class="badge" title="${obj.sourceBook||''}">${obj.sourceTag}</span>` : '';
}
function mod(score){ return Math.floor((score-10)/2); }
function modStr(score){ const m = mod(score); return (m>=0?"+":"")+m; }
// Use signed() for values that are ALREADY a modifier/bonus (e.g. a computed saving throw
// or skill total) — never pass such values into modStr(), which expects a raw ability score
// (10-20 range) and would incorrectly re-apply the mod() formula to it.
function signed(n){ return (n>=0?"+":"")+n; }
function proficiencyBonusForLevel(level){ return Math.floor((level-1)/4)+2; }

function goldToNumber(costStr){
  // parses strings like "10 GP", "5 SP", "2 CP", "1500 GP" -> returns GP value
  if(!costStr || costStr==='-') return 0;
  const m = costStr.match(/([\d.]+)\s*(GP|SP|CP)/i);
  if(!m) return 0;
  const val = parseFloat(m[1]);
  const unit = m[2].toUpperCase();
  if(unit==='GP') return val;
  if(unit==='SP') return val/10;
  if(unit==='CP') return val/100;
  return 0;
}

function classDef(id){ return DATA.classes.find(c=>c.id===id); }
function totalClassLevels(){ return state.classes.reduce((s,c)=>s+c.level,0); }
function firstClassId(){ return state.classes.length? state.classes[0].id : null; }
function hasGoldChoice(){ return state.classEquipChoice==='gold' || state.backgroundEquipChoice==='gold'; }

function renderSteps(){
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = STEPS.map((s,i)=>{
    if(i===STEP.SHOPPING && !hasGoldChoice() && state.step!==STEP.SHOPPING) return ''; // hide shopping pill if not relevant
    let cls = 'step-pill';
    if(i===state.step) cls+=' active';
    else if(i<=state.maxStepReached) cls+=' done';
    // Only steps already reached at some point (or the current one) are directly clickable —
    // jumping ahead to a step you haven't reached yet could skip required choices.
    const clickable = i <= state.maxStepReached;
    return `<span class="${cls}"${clickable?` onclick="goTo(${i})" style="cursor:pointer;"`:''}>${i+1}. ${s}</span>`;
  }).join('');
}

function goTo(step){
  // skip shopping step if not needed
  if(step===STEP.SHOPPING && !hasGoldChoice()){
    step = state.step < STEP.SHOPPING ? STEP.SUMMARY : STEP.EQUIPMENT;
  }
  state.step = step;
  state.maxStepReached = Math.max(state.maxStepReached, step);
  window.scrollTo(0,0);
  render();
}

function render(){
  renderSteps();
  renderLiveAbilityBar();
  const app = document.getElementById('app');
  switch(state.step){
    case STEP.LEVEL: app.innerHTML = renderLevelStep(); break;
    case STEP.ABILITIES: app.innerHTML = renderAbilityStep(); attachAbilityHandlers(); break;
    case STEP.SPECIES: app.innerHTML = renderSpeciesStep(); attachSpeciesHandlers(); break;
    case STEP.CLASSES: app.innerHTML = renderClassStep(); attachClassHandlers(); break;
    case STEP.HP: app.innerHTML = renderHPStep(); attachHPHandlers(); break;
    case STEP.DECISIONS: app.innerHTML = renderLevelUpStep(); attachLevelUpHandlers(); break;
    case STEP.SPELLS: app.innerHTML = renderSpellStep(); attachSpellHandlers(); break;
    case STEP.BACKGROUND: app.innerHTML = renderBackgroundStep(); attachBackgroundHandlers(); break;
    case STEP.EQUIPMENT: app.innerHTML = renderEquipmentStep(); attachEquipmentHandlers(); break;
    case STEP.SHOPPING: app.innerHTML = renderShoppingStep(); attachShoppingHandlers(); break;
    case STEP.SUMMARY: app.innerHTML = renderSummaryStep(); attachSummaryHandlers(); break;
  }
}

// Small sticky bar showing the current fully-computed ability scores (species + background +
// ASI bonuses as far as known), so the player doesn't have to scroll/click back to the Abilities
// step to check a number while making decisions that depend on it (Background points, primary
// ability at Classes, CON for HP).
function renderLiveAbilityBar(){
  const bar = document.getElementById('liveAbilityBar');
  if(!bar) return;
  const relevantSteps = [STEP.BACKGROUND, STEP.CLASSES, STEP.HP];
  if(!relevantSteps.includes(state.step)){ bar.innerHTML=''; return; }
  const scores = computeFullFinalAbilityScoresSafe();
  bar.innerHTML = `<div class="live-ability-bar">${ABILITIES.map(a=>{
    const abbrev = {Strength:'STR', Dexterity:'DEX', Constitution:'CON', Intelligence:'INT', Wisdom:'WIS', Charisma:'CHA'}[a];
    const m = mod(scores[a]);
    return `<span><b>${abbrev}</b> ${scores[a]} (${signed(m)})</span>`;
  }).join('')}</div>`;
}

// ---------- STEP 0: LEVEL ----------
function renderLevelStep(){
  return `
  <div class="panel">
    <h2>Schritt 1: Startlevel</h2>
    <label>Charaktername (optional)</label>
    <input type="text" id="charName" value="${state.charName}" placeholder="Name des Charakters">
    <label>Auf welcher Stufe soll der Charakter erstellt werden? (1-20)</label>
    <input type="number" id="levelInput" min="1" max="20" value="${state.level}">
    <p style="color:var(--muted);font-size:0.85em;margin-top:10px;">Bei Multiclassing verteilst du diese Gesamtstufe später frei auf mehrere Klassen.</p>
    <div class="choice-box" style="margin-top:16px;">
      <label style="font-weight:normal;"><input type="checkbox" id="allowOtherSettingCbStep1" ${state.allowOtherSettingContent?'checked':''}> Mein DM erlaubt Inhalte aus Ravenloft und Eberron, die deren Welt als Grundkonzept voraussetzen (z.B. Dragonmarked-House-Hintergründe &amp; -Feats, Dark Gifts)</label>
    </div>
    <button onclick="nextFromLevel()">Weiter →</button>
  </div>`;
}
function nextFromLevel(){
  const v = parseInt(document.getElementById('levelInput').value)||1;
  state.level = Math.min(20, Math.max(1, v));
  state.charName = document.getElementById('charName').value;
  const cb = document.getElementById('allowOtherSettingCbStep1');
  const newValue = cb ? cb.checked : state.allowOtherSettingContent;
  if(newValue !== state.allowOtherSettingContent){
    // Changing this can hide the currently selected setting-locked background (Eberron heir) or
    // invalidate a Dark Gift default (Ravenloft) — reset affected background choices cleanly.
    state.backgroundId = null;
    state.darkGiftOverrideFeat = null;
    state.backgroundFeatSubChoice = null;
    state.backgroundToolChoice = null;
  }
  state.allowOtherSettingContent = newValue;
  goTo(STEP.ABILITIES);
}

// ---------- STEP 1: ABILITIES ----------
function renderAbilityStep(){
  const methodOptions = [
    {id:'standard', label:'Standard Array (15,14,13,12,10,8)'},
    {id:'pointbuy', label:'Point Buy (27 Punkte)'},
    {id:'roll', label:'Würfeln (eigene Werte eintragen)'}
  ];
  let methodHtml = methodOptions.map(m=>`<div class="card ${state.abilityMethod===m.id?'selected':''}" data-method="${m.id}"><h3>${m.label}</h3></div>`).join('');

  let inputsHtml = '';
  if(state.abilityMethod==='roll'){
    inputsHtml += '<h3 style="margin-top:20px;">Werte zuweisen</h3>';
    inputsHtml += '<p style="font-size:0.85em;color:var(--muted);">Trage die 6 am Tisch gewürfelten Werte ein (z.B. 4W6, niedrigsten weglassen).</p>';
    inputsHtml += '<div class="grid3">';
    for(let i=0;i<6;i++){
      inputsHtml += `<div><label>Wert ${i+1}</label><input type="number" min="1" max="20" id="rolled_${i}" value="${state.rolledValues[i]??''}" onchange="onRolledValueChange()"></div>`;
    }
    inputsHtml += '</div><h4 style="margin-top:16px;">Zuordnung zu Attributen</h4><div id="rollAssignArea"></div>';
  } else if(state.abilityMethod==='standard'){
    inputsHtml += '<h3 style="margin-top:20px;">Werte zuweisen</h3>';
    inputsHtml += '<p style="font-size:0.85em;color:var(--muted);">Ordne die Werte 15, 14, 13, 12, 10, 8 den Attributen zu. Bereits verwendete Werte verschwinden aus den anderen Auswahlfeldern.</p>';
    inputsHtml += '<div id="standardAssignArea"></div>';
  } else if(state.abilityMethod==='pointbuy'){
    inputsHtml += '<h3 style="margin-top:20px;">Werte zuweisen</h3>';
    inputsHtml += '<p style="font-size:0.85em;color:var(--muted);">27 Punkte, Werte 8-15. Kosten: 8=0,9=1,10=2,11=3,12=4,13=5,14=7,15=9.</p>';
    inputsHtml += '<div id="pointBuyRemaining" style="margin-bottom:8px;font-weight:bold;color:var(--accent2);"></div>';
    ABILITIES.forEach(a=>{
      inputsHtml += `<div class="ability-row"><label>${ABIL_DE[a]}</label>
        <select class="pb-select" id="pb_${a}">
          ${[8,9,10,11,12,13,14,15].map(v=>`<option value="${v}">${v}</option>`).join('')}
        </select></div>`;
    });
  }

  return `
  <div class="panel">
    <h2>Schritt 2: Attribute</h2>
    <label>Methode wählen</label>
    ${methodHtml}
    ${inputsHtml}
    <div style="margin-top:16px;">
      <button class="secondary" onclick="goTo(STEP.LEVEL)">← Zurück</button>
      <button onclick="nextFromAbilities()">Weiter →</button>
    </div>
  </div>`;
}

function onRolledValueChange(){
  for(let i=0;i<6;i++){
    const el = document.getElementById('rolled_'+i);
    state.rolledValues[i] = el.value ? parseInt(el.value) : null;
  }
  renderRollAssignArea();
}

function renderRollAssignArea(){
  const area = document.getElementById('rollAssignArea');
  if(!area) return;
  // clean up assignments referencing missing values
  const usedIdx = new Set(Object.values(state.rolledAssignment).filter(v=>v!==undefined && v!==''));
  let html = '';
  ABILITIES.forEach(a=>{
    const currentIdx = state.rolledAssignment[a];
    let options = '<option value="">--wählen--</option>';
    for(let i=0;i<6;i++){
      if(state.rolledValues[i]===null || state.rolledValues[i]===undefined) continue;
      if(usedIdx.has(i) && i!==currentIdx) continue; // hide used values except current selection
      options += `<option value="${i}" ${currentIdx===i?'selected':''}>${state.rolledValues[i]}</option>`;
    }
    html += `<div class="ability-row"><label>${ABIL_DE[a]}</label>
      <select id="rollassign_${a}" onchange="onRollAssignChange('${a}')">${options}</select></div>`;
  });
  area.innerHTML = html;
}
function onRollAssignChange(a){
  const el = document.getElementById('rollassign_'+a);
  const v = el.value;
  if(v==='') delete state.rolledAssignment[a];
  else state.rolledAssignment[a] = parseInt(v);
  renderRollAssignArea();
}

function renderStandardAssignArea(){
  const area = document.getElementById('standardAssignArea');
  if(!area) return;
  const STD_VALUES = [15,14,13,12,10,8];
  const used = new Set(Object.values(state.standardAssignment).filter(v=>v!==undefined && v!==''));
  let html = '';
  ABILITIES.forEach(a=>{
    const current = state.standardAssignment[a];
    let options = '<option value="">--wählen--</option>';
    STD_VALUES.forEach(v=>{
      if(used.has(v) && v!==current) return;
      options += `<option value="${v}" ${current===v?'selected':''}>${v}</option>`;
    });
    html += `<div class="ability-row"><label>${ABIL_DE[a]}</label>
      <select id="stdassign_${a}" onchange="onStdAssignChange('${a}')">${options}</select></div>`;
  });
  area.innerHTML = html;
}
function onStdAssignChange(a){
  const el = document.getElementById('stdassign_'+a);
  const v = el.value;
  if(v==='') delete state.standardAssignment[a];
  else state.standardAssignment[a] = parseInt(v);
  renderStandardAssignArea();
}

function attachAbilityHandlers(){
  document.querySelectorAll('[data-method]').forEach(el=>{
    el.onclick = ()=>{ state.abilityMethod = el.getAttribute('data-method'); render(); };
  });
  if(state.abilityMethod === 'pointbuy'){
    const cost = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
    function updateRemaining(){
      let total = 0;
      ABILITIES.forEach(a=>{ const v = parseInt(document.getElementById('pb_'+a).value); total += cost[v]||0; });
      const rem = 27-total;
      const el = document.getElementById('pointBuyRemaining');
      el.textContent = 'Verbleibende Punkte: ' + rem;
      el.style.color = rem<0 ? '#c0405f' : 'var(--accent2)';
    }
    ABILITIES.forEach(a=>{
      const el = document.getElementById('pb_'+a);
      if(el){ el.value = state.abilityScores[a]; el.onchange = updateRemaining; }
    });
    updateRemaining();
  } else if(state.abilityMethod === 'roll'){
    renderRollAssignArea();
  } else if(state.abilityMethod === 'standard'){
    renderStandardAssignArea();
  }
}

function nextFromAbilities(){
  if(!state.abilityMethod){ alert('Bitte zuerst eine Methode wählen.'); return; }
  if(state.abilityMethod === 'pointbuy'){
    const cost = {8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
    let total = 0;
    ABILITIES.forEach(a=>{
      const v = parseInt(document.getElementById('pb_'+a).value);
      state.abilityScores[a] = v;
      total += cost[v]||0;
    });
    if(total>27){ alert('Zu viele Punkte verwendet ('+total+'/27). Bitte anpassen.'); return; }
  } else if(state.abilityMethod === 'standard'){
    for(const a of ABILITIES){ if(state.standardAssignment[a]===undefined){ alert('Bitte allen Attributen einen Wert zuordnen.'); return; } }
    ABILITIES.forEach(a=>{ state.abilityScores[a] = state.standardAssignment[a]; });
  } else if(state.abilityMethod === 'roll'){
    for(let i=0;i<6;i++){ if(!state.rolledValues[i]){ alert('Bitte alle 6 gewürfelten Werte eintragen.'); return; } }
    for(const a of ABILITIES){ if(state.rolledAssignment[a]===undefined){ alert('Bitte jedem Attribut einen gewürfelten Wert zuordnen.'); return; } }
    ABILITIES.forEach(a=>{ state.abilityScores[a] = state.rolledValues[state.rolledAssignment[a]]; });
  }
  goTo(STEP.SPECIES);
}
// ---------- STEP 2: SPECIES ----------
function resolveSpeciesSubChoiceDetails(){
  if(!state.speciesId || !state.speciesSubChoice) return '';
  const sp = DATA.species.find(s=>s.id===state.speciesId);
  if(!sp.subChoice) return '';

  if(state.speciesId === 'dragonborn'){
    const m = state.speciesSubChoice.match(/\(([^)]+)\)/);
    const dmgType = m ? m[1] : '?';
    return `<div class="info-box"><b>Konkret für deine Wahl (${state.speciesSubChoice}):</b><br>
      Damage Resistance: Resistenz gegen <b>${dmgType}</b>-Schaden.<br>
      Breath Weapon: 1d10 <b>${dmgType}</b>-Schaden (2d10 auf Stufe 5, 3d10 auf Stufe 11, 4d10 auf Stufe 17).</div>`;
  }

  const details = DATA.subChoiceDetails && DATA.subChoiceDetails[state.speciesId];
  if(!details) return '';
  const entry = details[state.speciesSubChoice];
  if(!entry) return '';

  let html = `<div class="info-box"><b>Konkret für deine Wahl (${state.speciesSubChoice}):</b><br>`;
  if(entry.resistance) html += `Damage Resistance: <b>${entry.resistance}</b>-Schaden.<br>`;
  if(entry.cantrip) html += `Zaubertrick: <b>${entry.cantrip}</b>.<br>`;
  if(entry.extra) html += `${entry.extra}<br>`;
  if(entry.level3) html += `Ab Stufe 3 immer vorbereitet: <b>${entry.level3}</b> (1x/Tag ohne Slot, danach normale Slots nutzbar).<br>`;
  if(entry.level5) html += `Ab Stufe 5 immer vorbereitet: <b>${entry.level5}</b> (1x/Tag ohne Slot, danach normale Slots nutzbar).<br>`;
  html += `</div>`;
  return html;
}

  if(sp.subChoice){
    const current = state.speciesSubChoice || '';
    info += `<div class="choice-box"><h4>${sp.subChoice.label}</h4>
      <select data-speciessub>
        <option value="">--wählen--</option>
        ${alphaSort(sp.subChoice.options).map(o=>`<option value="${o}" ${current===o?'selected':''}>${o}</option>`).join('')}
      </select>
      </div>`;
    info += resolveSpeciesSubChoiceDetails();
  }

  if(sp.sizeChoice){
    const current = state.speciesSizeChoice || '';
    info += `<div class="choice-box"><h4>Größe wählen</h4>
      <select data-speciessize>
        <option value="">--wählen--</option>
        <option value="Medium" ${current==='Medium'?'selected':''}>Medium</option>
        <option value="Small" ${current==='Small'?'selected':''}>Small</option>
      </select>
      </div>`;
  }

  if(sp.abilityChoice){
    const current = state.speciesAbilityChoice || '';
    info += `<div class="choice-box"><h4>${sp.abilityChoice.label}</h4>
      <select data-speciesability>
        <option value="">--wählen--</option>
        ${sp.abilityChoice.options.map(a=>`<option value="${a}" ${current===a?'selected':''}>${ABIL_DE[a]}</option>`).join('')}
      </select>
      </div>`;
  }

  if(sp.skillChoiceLimited){
    const count = sp.skillChoiceLimited.count || 1;
    if(count > 1){
      if(!Array.isArray(state.speciesSkillChoice)) state.speciesSkillChoice = [];
      setupDedupSelect('speciesskillmulti', count, state.speciesSkillChoice, null);

      info += `<div class="choice-box"><h4>${sp.skillChoiceLimited.label}</h4>
        <div id="speciesskillmulti_container">${renderDedupSelects('speciesskillmulti', count, sp.skillChoiceLimited.options, state.speciesSkillChoice)}</div>
        </div>`;
    } else {
      const current = state.speciesSkillChoice || '';
      info += `<div class="choice-box"><h4>${sp.skillChoiceLimited.label}</h4>
        <select data-speciesskill>
          <option value="">--wählen--</option>
          ${sp.skillChoiceLimited.options.map(s=>`<option value="${s}" ${current===s?'selected':''}>${s}</option>`).join('')}
        </select>
        </div>`;
    }
  }

  if(sp.skillChoiceFree){
    const current = state.speciesSkillChoice || '';
    info += `<div class="choice-box"><h4>${sp.skillChoiceFree.label}</h4>
      <select data-speciesskill>
        <option value="">--wählen--</option>
        ${alphaSort(SKILLS).map(s=>`<option value="${s}" ${current===s?'selected':''}>${s}</option>`).join('')}
      </select>
      </div>`;
  }

  if(sp.damageTypeChoice){
    const current = state.speciesDamageTypeChoice || '';
    info += `<div class="choice-box"><h4>${sp.damageTypeChoice.label}</h4>
      <select data-speciesdmgtype>
        <option value="">--wählen--</option>
        ${sp.damageTypeChoice.options.map(d=>`<option value="${d}" ${current===d?'selected':''}>${d}</option>`).join('')}
      </select>
      </div>`;
  }

  if(sp.humanChoices){
    const skillCurrent = state.speciesSkillChoice || '';
    info += `<div class="choice-box"><h4>Skillful – Fertigkeit wählen</h4>
      <select data-speciesskill>
        <option value="">--wählen--</option>
        ${alphaSort(SKILLS).map(s=>`<option value="${s}" ${skillCurrent===s?'selected':''}>${s}</option>`).join('')}
      </select>
      </div>`;

    const featCurrent = (state.speciesExtraFeat && state.speciesExtraFeat.name) || '';
    info += `<div class="choice-box"><h4>Versatile – zusätzlicher Origin Feat</h4>
      <select data-speciesfeat>
        <option value="">--wählen--</option>
        ${alphaSort(DATA.feats_origin, f=>f.name).map(f=>`<option value="${f.name}" ${featCurrent===f.name?'selected':''}>${f.name} (Origin, ${f.sourceTag||'PHB'})</option>`).join('')}
      </select>`;
    if(featCurrent){
      const featDef = DATA.feats_origin.find(f=>f.name===featCurrent);
      info += `<div class="info-box">${sourceBadge(featDef)}${featDef.desc}</div>`;
      if(!state.speciesExtraFeat.sub) state.speciesExtraFeat.sub = {};
      info += `<div id="speciesFeatSubArea">${renderFeatSubChoiceUI(featDef, 'SPECIESFEAT', state.speciesExtraFeat.sub)}</div>`;
    }

function renderSpeciesStep(){
  let cards = alphaSort(DATA.species, sp=>sp.name).map(sp=>{
    const isSelected = state.speciesId===sp.id;
    const card = `<div class="card ${isSelected?'selected':''}" data-species="${sp.id}">
      <h3>${sp.name}${sp.sourceTag?` <span class="badge" title="${sp.sourceBook||''}">${sp.sourceTag}</span>`:''}</h3>
      <p>Größe: ${sp.size} &middot; Speed: ${sp.speed} ft</p>
    </div>`;
    // Expanded details render immediately after the selected card, spanning the full grid width —
    // an accordion-style in-place expansion instead of a separate block after the whole list,
    // so the player doesn't have to scroll past every other option to reach their own choices.
    const expanded = isSelected ? `<div style="grid-column:1/-1;">${buildSpeciesInfoHtml(sp)}</div>` : '';
    return card + expanded;
  }).join('');
  return `
  <div class="panel">
    <h2>Schritt 3: Volk (Species)</h2>
    <div class="grid">${cards}</div>
    <div style="margin-top:16px;">
      <button class="secondary" onclick="goTo(STEP.ABILITIES)">← Zurück</button>
      <button onclick="nextFromSpecies()" ${!state.speciesId?'disabled':''}>Weiter →</button>
    </div>
  </div>`;
}
function attachSpeciesHandlers(){
  document.querySelectorAll('[data-species]').forEach(el=>{
    el.onclick = ()=>{
      state.speciesId = el.getAttribute('data-species');
      state.speciesSubChoice = null;
      state.speciesSkillChoice = null;
      state.speciesExtraFeat = null;
      state.speciesAbilityChoice = null;
      state.speciesDamageTypeChoice = null;
      state.speciesSizeChoice = null;
      render();
    };
  });
  const subSel = document.querySelector('[data-speciessub]');
  if(subSel) subSel.onchange = ()=>{ state.speciesSubChoice = subSel.value; render(); };
  const skillSel = document.querySelector('[data-speciesskill]');
  if(skillSel) skillSel.onchange = ()=>{ state.speciesSkillChoice = skillSel.value; };
  const speciesAbilitySel = document.querySelector('[data-speciesability]');
  if(speciesAbilitySel) speciesAbilitySel.onchange = ()=>{ state.speciesAbilityChoice = speciesAbilitySel.value; };
  const sizeSel = document.querySelector('[data-speciessize]');
  if(sizeSel) sizeSel.onchange = ()=>{ state.speciesSizeChoice = sizeSel.value; };
  const dmgTypeSel = document.querySelector('[data-speciesdmgtype]');
  if(dmgTypeSel) dmgTypeSel.onchange = ()=>{ state.speciesDamageTypeChoice = dmgTypeSel.value; };
  const featSel = document.querySelector('[data-speciesfeat]');
  if(featSel) featSel.onchange = ()=>{ state.speciesExtraFeat = {name: featSel.value, sub:{}}; render(); };

  // generic feat sub-choice handlers reusing SPECIESFEAT prefix
  const abilitySel = document.querySelector('[data-featsub-ability="SPECIESFEAT"]');
  if(abilitySel) abilitySel.onchange = ()=>{ if(!state.speciesExtraFeat.sub) state.speciesExtraFeat.sub={}; state.speciesExtraFeat.sub.ability = abilitySel.value; };
  const dmgSel = document.querySelector('[data-featsub-dmgtype="SPECIESFEAT"]');
  if(dmgSel) dmgSel.onchange = ()=>{ if(!state.speciesExtraFeat.sub) state.speciesExtraFeat.sub={}; state.speciesExtraFeat.sub.damageType = dmgSel.value; };
  const miSel = document.querySelector('[data-featsub-miclass="SPECIESFEAT"]');
  if(miSel) miSel.onchange = ()=>{ state.speciesExtraFeat.sub = state.speciesExtraFeat.sub||{}; state.speciesExtraFeat.sub.magicClass = miSel.value; state.speciesExtraFeat.sub.cantrips=[]; state.speciesExtraFeat.sub.level1=[]; render(); };
  const schoolSel = document.querySelector('[data-featsub-schoolspell="SPECIESFEAT"]');
  if(schoolSel) schoolSel.onchange = ()=>{ if(!state.speciesExtraFeat.sub) state.speciesExtraFeat.sub={}; state.speciesExtraFeat.sub.schoolSpell = schoolSel.value; };
  document.querySelectorAll('select[id^="SPECIESFEAT_"]').forEach(el=>{
    el.onchange = ()=>{
      const id = el.id;
      const m = id.match(/^SPECIESFEAT_(st|tool|instr|wpn|micantrip|mil1|ritual)_(\d+)$/);
      if(!m) return;
      const kind = m[1];
      let arrName = {st:'picks', tool:'picks', instr:'picks', wpn:'picks', micantrip:'cantrips', mil1:'level1', ritual:'ritualSpells'}[kind];
      const count = document.querySelectorAll(`select[id^="SPECIESFEAT_${kind}_"]`).length;
      const arr = [];
      for(let i=0;i<count;i++){
        const s = document.getElementById('SPECIESFEAT_'+kind+'_'+i);
        if(s && s.value) arr[i]=s.value;
      }
      state.speciesExtraFeat.sub = state.speciesExtraFeat.sub || {};
      state.speciesExtraFeat.sub[arrName] = arr.filter(Boolean);
      render();
    };
  });
}
function nextFromSpecies(){
  if(!state.speciesId) return;
  const sp = DATA.species.find(s=>s.id===state.speciesId);
  if(sp.subChoice && !state.speciesSubChoice){ alert('Bitte '+sp.subChoice.label+' wählen.'); return; }
  if(sp.sizeChoice && !state.speciesSizeChoice){ alert('Bitte eine Größe wählen (Medium oder Small).'); return; }
  if(sp.abilityChoice && !state.speciesAbilityChoice){ alert('Bitte '+sp.abilityChoice.label+' wählen.'); return; }
  if(sp.skillChoiceLimited){
    const needCount = sp.skillChoiceLimited.count || 1;
    const picked = Array.isArray(state.speciesSkillChoice) ? state.speciesSkillChoice : (state.speciesSkillChoice? [state.speciesSkillChoice] : []);
    if(picked.filter(Boolean).length < needCount){ alert('Bitte '+sp.skillChoiceLimited.label+' wählen.'); return; }
  }
  if(sp.skillChoiceFree && !state.speciesSkillChoice){ alert('Bitte '+sp.skillChoiceFree.label+' wählen.'); return; }
  if(sp.damageTypeChoice && !state.speciesDamageTypeChoice){ alert('Bitte '+sp.damageTypeChoice.label+' wählen.'); return; }
  if(sp.humanChoices){
    if(!state.speciesSkillChoice){ alert('Bitte eine Fertigkeit für Skillful wählen.'); return; }
    if(!state.speciesExtraFeat || !state.speciesExtraFeat.name){ alert('Bitte einen zusätzlichen Origin Feat für Versatile wählen.'); return; }
  }
  goTo(STEP.BACKGROUND);
}

// ---------- STEP 3: CLASSES (Multiclass) ----------
function checkPrereq(classId){ return DATA.multiclassPrerequisiteAbility[classId]; }

// Resolves a skill-choice "options" array to actual skill names. Some multiclass skill entries
// use placeholder strings like "Rogue-Liste" / "Ranger-Liste" that refer to that class's own
// full level-1 skill list rather than spelling it out again.
function resolveSkillPool(options, cdef){
  if(!options || !options.length) return SKILLS;
  if(options.includes('any')) return SKILLS;
  if(options.some(o=>typeof o==='string' && o.endsWith('-Liste'))){
    return (cdef.level1SkillChoices && cdef.level1SkillChoices.options[0]!=='any')
      ? cdef.level1SkillChoices.options
      : SKILLS;
  }
  return options;
}

function buildClassExpandedHtml(c, idx){
  const cdef = c;
  const cl = state.classes[idx];
  const isFirst = idx===0;
  let html = `<div class="choice-box">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <b>${isFirst?'Startklasse':'Multiclass'}</b>
      <label style="margin:0;">Level</label>
      <input type="number" min="1" max="20" value="${cl.level}" data-levelidx="${idx}" style="width:70px;">
      <button class="secondary small" data-removeidx="${idx}">Entfernen</button>
    </div>
  </div>`;

  if(isFirst){
    html += `<div class="info-box"><b>${cdef.name} (Startklasse, volles Level-1-Paket):</b>
      Rüstung: ${cdef.level1Armor.join(', ')||'keine'} &middot; Waffen: ${cdef.level1Weapons.join(', ')} &middot;
      Skills: ${cdef.level1SkillChoices? cdef.level1SkillChoices.count+' aus '+cdef.level1SkillChoices.options.join(', ') : '-'}
      </div>`;
  } else {
    const mc = cdef.multiclass;
    html += `<div class="info-box"><b>${cdef.name} (Multiclass, reduziertes Paket):</b>
      Rüstung: ${mc.armor && mc.armor.length? mc.armor.join(', ') : 'keine'} &middot;
      Waffen: ${mc.weapons && mc.weapons.length? mc.weapons.join(', ') : 'keine'} &middot;
      Skills: ${mc.skills? mc.skills.count+' aus '+resolveSkillPool(mc.skills.options, cdef).join(', ') : 'keine zusätzlichen'}
      ${mc.note? '<br><i>'+mc.note+'</i>':''}
      </div>`;
  }

  const choiceInfo = isFirst ? cdef.level1SkillChoices : cdef.multiclass.skills;
  if(choiceInfo){
    const alreadyProf = (typeof skillsAlreadyProficientSoFar === 'function') ? skillsAlreadyProficientSoFar(cdef.id) : new Set();
    const pool = alphaSort(resolveSkillPool(choiceInfo.options, cdef).filter(s => !alreadyProf.has(s)));

    html += `<div class="choice-box"><h4>${cdef.name} – Skill-Proficiencies (${choiceInfo.count} wählen)</h4>

      <div id="skillchoice_${cdef.id}_container">${renderDedupSelects('skillchoice_'+cdef.id, choiceInfo.count, pool, current)}</div>

  }
  return html;
}
function renderClassStep(){

function nextFromClasses(){

// ---------- STEP 4 (STEP.HP): HIT POINTS ----------
// Rules: The very first class level of the character (level 1 overall) always uses the MAX die value + Con mod.
// Every subsequent level-up (whether in the same class or a new multiclass class) lets the player choose
// "average" (fixed value per PHB table) or "roll" (manual die entry) for that class's Hit Die.
function hpFixedValue(hitDie){ return FIXED_HP_BY_HITDIE[hitDie] || 5; }

function buildHpLevelSequence(){
  // Returns an array of {classId, hitDie, isFirst} entries in the order levels were taken:
  // first entry = character level 1 (max), then each class's levels 2..N in the order classes were added.
  const seq = [];
  state.classes.forEach((cl, idx)=>{
    const cdef = classDef(cl.id);
    const startLevel = idx===0 ? 2 : 1; // starting class already had its level-1 handled as the fixed max entry
    for(let lvl=startLevel; lvl<=cl.level; lvl++){
      seq.push({classId: cl.id, hitDie: cdef.hitDie, level: lvl});
    }
  });
  return seq;
}

function renderHPStep(){
  if(state.classes.length===0){
    return `<div class="panel"><h2>Schritt 6: Trefferpunkte (HP)</h2><p>Bitte zuerst eine Klasse wählen.</p>
    <button class="secondary" onclick="goTo(STEP.CLASSES)">← Zurück</button></div>`;
  }
  const conMod = mod(computeFullFinalAbilityScoresSafe().Constitution);
  const startClass = classDef(firstClassId());
  const maxFirst = startClass.hitDie + conMod;

  let html = `<div class="panel"><h2>Schritt 6: Trefferpunkte (HP)</h2>
    <p style="font-size:0.85em;color:var(--muted);">Stufe 1 deiner Startklasse gibt immer den Maximalwert des Hit Die. Für jede weitere Stufe (auch bei Multiclass-Klassen) wählst du zwischen Durchschnittswert und manuellem Würfelergebnis.</p>
    <div class="choice-box">
      <h4>Charakter-Stufe 1 (${startClass.name}, d${startClass.hitDie})</h4>
      <p>Maximalwert: <b>${startClass.hitDie}</b> + KON-Mod (${modStr(conMod)}) = <b>${maxFirst}</b> HP (fix, keine Wahl nötig)</p>
    </div>`;

  const seq = buildHpLevelSequence();
  let runningTotal = maxFirst;
  seq.forEach((entry, i)=>{
    const cdef = classDef(entry.classId);
    const key = entry.classId+'__hp__'+entry.level+'__'+i;
    const stored = state.hpRolls[key] || {};
    const fixedVal = hpFixedValue(entry.hitDie);
    html += `<div class="choice-box">
      <h4>${cdef.name} – weitere Stufe (d${entry.hitDie})</h4>
      <div>
        <button class="small ${stored.mode==='average'?'':'secondary'}" data-hpmode="${key}|average">Durchschnitt (${fixedVal} + KON-Mod)</button>
        <button class="small ${stored.mode==='roll'?'':'secondary'}" data-hpmode="${key}|roll">Manuell würfeln</button>
      </div>`;
    if(stored.mode==='roll'){
      html += `<div style="margin-top:8px;"><label style="font-weight:normal;">Gewürfelter Wert (1-${entry.hitDie})</label>
        <input type="number" min="1" max="${entry.hitDie}" style="max-width:100px;" data-hprollinput="${key}" value="${stored.rollValue||''}"></div>`;
    }
    const thisVal = stored.mode==='average' ? fixedVal+conMod : (stored.mode==='roll' && stored.rollValue ? stored.rollValue+conMod : null);
    if(thisVal!==null){ runningTotal += thisVal; }
    html += `</div>`;
  });

  html += `<div class="info-box"><b>Aktuelle Gesamtsumme (soweit ausgefüllt):</b> ${runningTotal + hpFlatBonusPerLevel()*state.level} HP${hpFlatBonusNoteInline()}</div>`;

      <button class="secondary" onclick="goTo(STEP.CLASSES)">← Zurück</button>
      <button onclick="tryNextFromHP()">Weiter →</button>
    </div></div>`;
  return html;
}

function tryNextFromHP(){
  const seq = buildHpLevelSequence();
  for(let i=0;i<seq.length;i++){
    const entry = seq[i];
    const key = entry.classId+'__hp__'+entry.level+'__'+i;
    const stored = state.hpRolls[key];
    if(!stored || !stored.mode){ alert('Bitte für alle weiteren Stufen Durchschnitt oder Würfelwert wählen.'); return; }
    if(stored.mode==='roll' && !stored.rollValue){ alert('Bitte einen gewürfelten Wert eintragen.'); return; }
  }
  goTo(STEP.DECISIONS);
}

function hpFlatBonusPerLevel(){
  let extra = 0;
  if(typeof hasFeatChosen === 'function' && hasFeatChosen('Tough')) extra += 2;
  if(state.speciesId === 'dwarf') extra += 1;
  return extra;
}
function hpFlatBonusNoteInline(){
  const notes = [];
  if(typeof hasFeatChosen === 'function' && hasFeatChosen('Tough')) notes.push('Tough');
  if(state.speciesId === 'dwarf') notes.push('Dwarven Toughness');
  return notes.length ? ' <span style="font-size:0.8em;color:var(--muted);">(inkl. '+notes.join(', ')+')</span>' : '';
}

// Computes total HP using final Constitution modifier (after ASI/feat boosts).
function computeTotalHP(){
  if(state.classes.length===0) return 0;
  const conMod = mod(computeFullFinalAbilityScoresSafe().Constitution);
  const startClass = classDef(firstClassId());
  let total = startClass.hitDie + conMod;
  const seq = buildHpLevelSequence();
  seq.forEach((entry, i)=>{
    const key = entry.classId+'__hp__'+entry.level+'__'+i;
    const stored = state.hpRolls[key];
    if(!stored) return;
    const val = stored.mode==='average' ? hpFixedValue(entry.hitDie) : (stored.rollValue||0);
    total += val + conMod;
  });
  // Flat per-level HP bonuses (Tough feat +2/level, Dwarf's Dwarven Toughness +1/level)
  total += hpFlatBonusPerLevel() * state.level;
  return total;
}
// Safe wrapper in case full background-adjusted scores aren't computed yet at HP step time (background comes after HP in flow)
function computeFullFinalAbilityScoresSafe(){
  if(typeof computeFullFinalAbilityScores === 'function'){
    try { return computeFullFinalAbilityScores(); } catch(e){ return computeFinalAbilityScores(); }
  }
  return computeFinalAbilityScores();
}

function weaponMasteryPool(poolType){
  // Show "Weaponname (Mastery-Eigenschaft)" so the player sees what the choice actually grants,
  // since the Mastery property is fixed per weapon, not separately chosen.
  const withMastery = (list)=> list.map(w => w.mastery ? `${w.name} (${w.mastery})` : w.name);
  if(poolType==='meleeOnly'){
    return withMastery([...DATA.weapons_simple_melee, ...DATA.weapons_martial_melee_examples]);
  }
  if(poolType==='finesseLightOrSimple'){
    const simple = withMastery([...DATA.weapons_simple_melee, ...DATA.weapons_simple_ranged]);
    const martialFinesseLight = withMastery(
      [...DATA.weapons_martial_melee_examples, ...DATA.weapons_martial_ranged_examples]
        .filter(w => (w.properties||[]).some(p=>p.startsWith('Finesse')||p.startsWith('Light')))
    );
    return [...simple, ...martialFinesseLight];
  }
  return withMastery([...DATA.weapons_simple_melee, ...DATA.weapons_simple_ranged, ...DATA.weapons_martial_melee_examples, ...DATA.weapons_martial_ranged_examples]);

function skillOrToolPool(){ return [...SKILLS, ...allToolNames()]; }
// Skills already granted proficiency from an earlier-chosen source in the flow (species Skillful,
// class skill picks so far, and — once selected — the background's fixed skill list). Used to keep
// these from being offered again in later skill-choice dropdowns, so no pick is wasted on a duplicate.
function skillsAlreadyProficientSoFar(excludeClassId){
  const set = new Set();
  if(state.speciesSkillChoice) set.add(state.speciesSkillChoice);
  Object.entries(state.classSkillChoices).forEach(([cid,arr])=>{
    if(cid===excludeClassId) return;
    (arr||[]).forEach(s=>set.add(s));
  });
  if(state.backgroundId){
    const bg = getSelectedBackground();
    if(bg) bg.skills.forEach(s=>set.add(s));
  }
  return set;
}
function findFeatDef(featName){
  // Background feat strings can include a parenthetical, e.g. "Magic Initiate (Wizard)".
  // Match against feats_origin by stripping any parenthetical suffix.
  const base = featName.replace(/\s*\(.*?\)\s*$/, '').trim();
  return DATA.feats_origin.find(f=>f.name===base) || DATA.feats_origin.find(f=>f.name===featName);
}
// Looks up a feat's page reference across BOTH General and Origin pools (findFeatDef above only
// searches Origin). Used to append book-page citations like "(PHB S. 203)" wherever feats are shown.
function findFeatDefAnyCategory(featName){
  const base = featName.replace(/\s*\(.*?\)\s*$/, '').trim();
  return DATA.feats_general.find(f=>f.name===base) || DATA.feats_origin.find(f=>f.name===base)
      || DATA.feats_general.find(f=>f.name===featName) || DATA.feats_origin.find(f=>f.name===featName);
}
function pageRefSuffix(def){
  if(!def || !def.pageRef) return '';
  return ` (${def.sourceTag||'PHB'} S. ${def.pageRef})`;
}
function getBackgroundFeatForcedClass(bg){
  // Extracts a class name from a background feat string like "Magic Initiate (Wizard)" and
  // returns the matching class id, or null if no parenthetical / no matching class.
  const m = bg.feat.match(/\(([^)]+)\)/);
  if(!m) return null;
  const label = m[1].trim().toLowerCase();
  const cdef = DATA.classes.find(c=>c.name.toLowerCase()===label);
  return cdef ? cdef.id : null;
}

// generic "choose N distinct options from list, dedupe across selects" renderer
function renderDedupSelects(idPrefix, count, pool, currentPicks){
  let html = '<div class="grid3">';
  for(let i=0;i<count;i++){
    const current = currentPicks[i];
    let opts = '<option value="">--wählen--</option>';
    pool.forEach(opt=>{
      const usedElsewhere = currentPicks.includes(opt) && opt!==current;
      if(usedElsewhere) return;
      opts += `<option value="${opt}" ${current===opt?'selected':''}>${opt}</option>`;
    });
    html += `<div><select id="${idPrefix}_${i}" onchange="onDedupSelectChange('${idPrefix}',${count})">${opts}</select></div>`;
  }
  html += '</div>';
  return html;
}
// after render, caller must supply a callback storage; we use a registry
const dedupRegistry = {};
function setupDedupSelect(idPrefix, count, currentPicksArrayRef, onUpdate){
  dedupRegistry[idPrefix] = {count, arr: currentPicksArrayRef, onUpdate};
}
function onDedupSelectChange(idPrefix, count){
  const reg = dedupRegistry[idPrefix];
  if(!reg) return;
  const arr = [];
  for(let i=0;i<count;i++){
    const el = document.getElementById(idPrefix+'_'+i);
    arr[i] = el.value || null;
  }
  reg.arr.length = 0;
  arr.forEach(v=>{ if(v) reg.arr.push(v); });
  if(reg.onUpdate) reg.onUpdate();
  // re-render just this control to update dropdown option availability
  const container = document.getElementById(idPrefix+'_container');
  if(container){
    container.innerHTML = renderDedupSelects(idPrefix, count, reg.pool, arr);
  }
}

// ---------- PENDING DECISIONS ----------
function asiLevelsFor(classId){ return ASI_LEVELS[classId] || ASI_LEVELS.default; }

// Resolves a subclass's automatic-spell table, handling both flat (level->spells) tables
// and nested ones like Druid/Circle of the Land, where the table is further keyed by the
// subclass's own "pick 1 of N" choice (e.g. terrain type).
function resolveAutoSpellTable(cdef, classId, subclass){
  const raw = cdef.subclassAutoSpells && cdef.subclassAutoSpells[subclass];
  if(!raw) return null;
  const firstVal = Object.values(raw)[0];
  const isNested = firstVal && !Array.isArray(firstVal);
  if(!isNested) return raw;
  const subDetails = cdef.subclassDetails && cdef.subclassDetails[subclass];
  if(!subDetails || !subDetails.choices || !subDetails.choices.length) return null;
  const choiceLevel = subDetails.choices[0].level;
  const key = classId+'__sc__'+choiceLevel+'__0';
  const chosen = state.subclassChoiceOptions[key];
  return chosen ? raw[chosen] : null;
}

function collectPendingDecisions(){
  const decisions = [];
  state.classes.forEach((cl)=>{
    const cdef = classDef(cl.id);
    const asiLv = asiLevelsFor(cl.id);
    if(cdef.weaponMastery){
      decisions.push({classId: cl.id, level: 1, type:'weaponmastery', key: cl.id+'__wm'});
    }
    for(let lvl=1; lvl<=cl.level; lvl++){
      const feats = (cdef.keyFeaturesByLevel && cdef.keyFeaturesByLevel[String(lvl)]) || [];
      if(asiLv.includes(lvl)){
        decisions.push({classId: cl.id, level: lvl, type:'asifeat', key: cl.id+'__'+lvl});
      }
      if(feats.some(f=>f.toLowerCase().includes('fighting style'))){
        decisions.push({classId: cl.id, level: lvl, type:'fightingstyle', key: cl.id+'__'+lvl});
      }
      if(cl.id==='cleric' && lvl===1){
        decisions.push({classId: cl.id, level: 1, type:'divineorder', key: cl.id+'__divineorder'});
      }
      if(cl.id==='druid' && lvl===1){
        decisions.push({classId: cl.id, level: 1, type:'primalorder', key: cl.id+'__primalorder'});
      }
      if(cl.id==='barbarian' && lvl===3){
        decisions.push({classId: cl.id, level: 3, type:'primalknowledge', key: cl.id+'__primalknowledge'});
      }
      if(cl.id==='cleric' && lvl===3 && state.subclassChoices.cleric==='Knowledge Domain'){
        decisions.push({classId: cl.id, level: 3, type:'extratool', key: cl.id+'__extratool'});
      }
      if(cl.id==='sorcerer' && lvl===6 && state.subclassChoices.sorcerer==='Draconic Sorcery'){
        decisions.push({classId: cl.id, level: 6, type:'elementalaffinity', key: cl.id+'__elementalaffinity'});
      }
      if(cl.id==='bard' && lvl===3 && state.subclassChoices.bard==='College of the Moon'){
        decisions.push({classId: cl.id, level: 3, type:'moonlore', key: cl.id+'__moonlore'});
      }
      if(feats.some(f=>f.toLowerCase().includes('subclass')) && !decisions.some(d=>d.type==='subclass' && d.classId===cl.id)){
        decisions.push({classId: cl.id, level: lvl, type:'subclass', key: cl.id+'_subclass'});
      }
    }
    // Subclass-specific decisions (Fighter: Battle Master maneuvers, Champion extra Fighting Style)
    const subclass = state.subclassChoices[cl.id];
    const subDetails = cdef.subclassDetails && subclass && cdef.subclassDetails[subclass];
    if(subDetails){
      if(subDetails.maneuverLevels){
        Object.entries(subDetails.maneuverLevels).forEach(([lvlStr, count])=>{
          const lvl = parseInt(lvlStr);
          if(cl.level >= lvl){
            decisions.push({classId: cl.id, level: lvl, type:'maneuvers', key: cl.id+'__man__'+lvl, count});
          }
        });
      }
      if(subDetails.extraFightingStyleLevel && cl.level >= subDetails.extraFightingStyleLevel){
        decisions.push({classId: cl.id, level: subDetails.extraFightingStyleLevel, type:'fightingstyle', key: cl.id+'__'+subDetails.extraFightingStyleLevel+'__extra'});
      }
      // Generic "pick 1 of N options" subclass choices (e.g. Ranger Hunter's Prey, Beast Master companion)
      if(subDetails.choices){
        subDetails.choices.forEach((c,i)=>{
          if(cl.level >= c.level){
            decisions.push({classId: cl.id, level: c.level, type:'subclasschoice', key: cl.id+'__sc__'+c.level+'__'+i, label: c.label, options: c.options});
          }
        });
      }
      // Bard College of Lore: 3 bonus skill proficiencies (Stufe 3)
      if(subDetails.loreBonusSkillsLevel && cl.level >= subDetails.loreBonusSkillsLevel){
        decisions.push({classId: cl.id, level: subDetails.loreBonusSkillsLevel, type:'loreskills', key: cl.id+'__loreskills', count: 3});
      }
      // Bard College of Lore: 2 "Magical Discoveries" spells from Cleric/Druid/Wizard (Stufe 6)
      if(subDetails.loreMagicalDiscoveriesLevel && cl.level >= subDetails.loreMagicalDiscoveriesLevel){
        decisions.push({classId: cl.id, level: subDetails.loreMagicalDiscoveriesLevel, type:'loremagic', key: cl.id+'__loremagic', count: 2});
      }
      // Wizard subclasses: "Savant" — 2 spells (grade <=2) from a specific school, free into spellbook
      if(subDetails.savantChoice && cl.level >= subDetails.savantChoice.level){
        decisions.push({classId: cl.id, level: subDetails.savantChoice.level, type:'savant', key: cl.id+'__savant', count: subDetails.savantChoice.count, school: subDetails.savantChoice.school});
      }
    }
    // Warlock: Eldritch Invocations (count grows by level thresholds)
    if(cdef.eldritchInvocationsKnownThresholds){
      const thresholds = cdef.eldritchInvocationsKnownThresholds;
      let known = 0;
      Object.entries(thresholds).forEach(([lvlStr, count])=>{
        if(cl.level >= parseInt(lvlStr)) known = count;
      });
      if(known>0){
        decisions.push({classId: cl.id, level: 1, type:'invocations', key: cl.id+'__inv', count: known});
      }
    }
    // Sorcerer: Metamagic (count grows by level thresholds)
    if(cdef.metamagicKnownThresholds){
      const thresholds = cdef.metamagicKnownThresholds;
      let known = 0;
      Object.entries(thresholds).forEach(([lvlStr, count])=>{
        if(cl.level >= parseInt(lvlStr)) known = count;
      });
      if(known>0){
        decisions.push({classId: cl.id, level: 1, type:'metamagic', key: cl.id+'__meta', count: known});
      }
    }
  });
  return decisions;
}

function renderLevelUpStep(){
  const decisions = collectPendingDecisions();
  if(decisions.length===0){
    return `<div class="panel">
      <h2>Schritt 7: Level-Up-Entscheidungen</h2>

        <button class="secondary" onclick="goTo(STEP.HP)">← Zurück</button>

        <select data-subclass="${d.classId}">
          <option value="">--wählen--</option>
          ${alphaSort(cdef.subclasses).map(s=>{
            const tag = (cdef.subclassSourceTags && cdef.subclassSourceTags[s]) || 'PHB';
            return `<option value="${s}" ${current===s?'selected':''}>${s} (${tag})</option>`;

      // Generic informational note per subclass (e.g. "rein passiv, keine Auswahl nötig" or spellcasting hints)

        html += `<div class="info-box">${cdef.subclassDetails[current].note}</div>`;
      }
      // Automatic subclass spells (e.g. Sorcerer Aberrant/Clockwork/Draconic) — no choice needed, just informational
      if(current && cdef.subclassAutoSpells && cdef.subclassAutoSpells[current]){
        const table = resolveAutoSpellTable(cdef, d.classId, current);
        const classInstance = state.classes.find(c=>c.id===d.classId);
        const curLevel = classInstance ? classInstance.level : d.level;
        const reached = table ? Object.entries(table).filter(([lvlStr,_])=>curLevel>=parseInt(lvlStr)) : [];
        if(reached.length){
          html += `<div class="info-box"><b>${current} – automatisch immer vorbereitete Zauber:</b><br>
            ${reached.map(([lvl,spells])=>`Stufe ${lvl}: ${spells.join(', ')}`).join('<br>')}
